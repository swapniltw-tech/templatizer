components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PremiumEstimateResponse:
      additionalProperties: false
      description: Estimated monthly premium (synthetic toy rule).
      properties:
        coverage_cents:
          title: Coverage Cents
          type: integer
        monthly_premium_cents:
          description: Monthly premium in cents, rounded up
          title: Monthly Premium Cents
          type: integer
        term_years:
          title: Term Years
          type: integer
      required:
      - coverage_cents
      - term_years
      - monthly_premium_cents
      title: PremiumEstimateResponse
      type: object
    StatusResponse:
      additionalProperties: false
      description: Body of /livez and /readyz.
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: StatusResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: reference-service
  version: 0.1.0
openapi: 3.1.0
paths:
  /livez:
    get:
      description: The process is running.
      operationId: get_livez
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: Successful Response
      security: []
      summary: Livez
      tags:
      - probes
  /readyz:
    get:
      description: The service can accept traffic.
      operationId: get_readyz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: Successful Response
      security: []
      summary: Readyz
      tags:
      - probes
  /v1/premium-estimates:
    get:
      description: Estimate the monthly premium for a coverage amount and term (synthetic
        toy rule).
      operationId: get_premium_estimate
      parameters:
      - description: Coverage amount in cents
        in: query
        name: coverage_cents
        required: true
        schema:
          description: Coverage amount in cents
          examples:
          - 25000000
          maximum: 1000000000000
          minimum: 1
          title: Coverage Cents
          type: integer
      - description: Term in years
        in: query
        name: term_years
        required: true
        schema:
          description: Term in years
          examples:
          - 20
          maximum: 40
          minimum: 1
          title: Term Years
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PremiumEstimateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security: []
      summary: Get Premium Estimate
      tags:
      - premium-estimates
