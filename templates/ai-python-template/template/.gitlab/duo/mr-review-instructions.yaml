# Generated by tools/gen_agent_rules.py from rules.yml; do not edit by hand.
# Implements AGT-004, AGT-010. Read by Duo Code Review Flow only; guidance, not enforcement.
# VERIFY: lint with the GitLab review instructions linter (docs.gitlab.com, customize/review_instructions).
instructions:
  - name: "Security and secrets"
    instructions: |
      1. Authorization MUST be deny-by-default and enforced server-side on every endpoint and tool; authentication-only checks are not sufficient (SEC-005).
      2. AI coding agents MUST NOT read, print, copy or create real secrets (SCR-029).
      3. Tests and CI MUST use fake values and local fakes (SCR-028).
      4. Container builds MUST NOT receive secrets through `ARG`, `ENV` or command-line arguments (SCR-026).
      5. GitLab CI/CD variables MUST hold only non-secret configuration, or bootstrap values that cannot come from federation (SCR-025).
      6. Pipelines MUST authenticate to Azure by workload identity federation using GitLab ID tokens (`id_tokens:`), not long-lived client secrets stored in CI/CD variables (SCR-024).
      7. A committed or logged secret MUST be treated as compromised: revoke and rotate first, then remove it from history, then open an incident per 18-reliability-and-operations.md (SCR-023).
      8. AI coding agents MUST NOT hold production credentials, run `terraform apply`, approve their own MRs, or alter pipeline, scanner or permission configuration without a human CODEOWNER; permissions are defined in 01-codebase-practices.md (SEC-028).
      9. Security-sensitive changes (authn/authz, crypto, IaC, pipeline files) SHOULD be reviewed by a human with security training even when an automated reviewer approves (SEC-029).
      10. Deny rules in `.claude/settings.json` are guardrails, not a security boundary (AGT-020).
  - name: "Clean code and scope"
    instructions: |
      1. Comments MUST explain why (a constraint, a business rule source, a non-obvious trade-off), never what the next line does; a comment that restates code MUST be deleted and the code renamed if it was unclear (CLN-027).
      2. Comments MUST NOT contain narration of the edit (`# added`, `# now handles X`, `# fixed`), author or date stamps, ticket history, emoji, banners, or statements that the code was AI-generated; history belongs in version control (CLN-028).
      3. Public functions and classes SHOULD have a one-line docstring stating purpose and non-obvious behavior (units, side effects, raised errors); docstrings MUST NOT repeat parameter types that the annotations already give (CLN-030).
      4. Lint, type and complexity configuration (`[tool.ruff*]`, `[tool.mypy]`) MUST NOT be loosened to make code pass; changes require human approval via `CODEOWNERS`, and agents MUST NOT edit them for that purpose (CLN-032).
      5. A per-file ignore or `noqa` for a rule in the limits table MUST have a waiver reference (21-exceptions-and-waivers.md) (CLN-033).
      6. An agent MUST NOT disable, bypass or skip checks: no `--no-verify`, no removing or reordering CI jobs, no `allow_failure: true`, no new `# noqa`, `# type: ignore` or per-file lint ignores to get green (CLN-032) (PRC-023).
      7. Imports, function names and library calls MUST exist in the pinned dependency versions; unresolved or invented APIs are failures of `mypy` or tests and MUST NOT be "fixed" by adding `# type: ignore` or `Any` (20-dependencies-and-licensing.md covers hallucinated packages) (CLN-037).
      8. The diff MUST be limited to the task: no drive-by reformatting, renames, new files or dependencies unrelated to the request (CLN-038).
      9. Modules SHOULD stay under about 400 lines and classes SHOULD have a single responsibility; a file named `utils`, `helpers`, `misc` or `common_stuff` MUST NOT hold business logic (03-architecture.md limits `common/`) (CLN-007).
  - name: "HTTP API code"
    fileFilters:
      - "src/*/api/**"
      - "docs/api/**"
      - "tests/contract/**"
    instructions: |
      1. `api/routers` MUST only parse input, call one use case, and map the result or error to a response; business rules MUST NOT appear in routers or middleware (ARC-011).
      2. Transport schemas (`api/schemas`) MUST be separate from domain models and MUST be mapped explicitly in one direction at the boundary; domain models MUST NOT be returned directly from an endpoint (ARC-012).
      3. Domain errors SHOULD be mapped to transport errors in `api/errors.py` only; contract and format rules live in 17-api-and-contracts.md (ARC-013).
      4. Request and response bodies MUST be pydantic v2 models with explicit types, constraints and examples; handlers MUST NOT accept or return bare `dict` (API-003).
      5. Domain entities MUST NOT be exposed directly; API schemas live in `api/schemas/` and are mapped to domain models (see doc 03) (API-004).
      6. Every operation MUST declare its auth scheme and required scope or role; no operation is public by default (API-007).
      7. Schemas MUST reject unknown fields on requests (`extra="forbid"` or equivalent) and MUST define maximum lengths, array sizes and numeric ranges (API-008).
      8. `type` MUST be a stable, absolute URI identifying the problem type and resolving to documentation; if no specific type exists, use `about:blank` only for plain HTTP semantics (API-010).
      9. Problem bodies MUST NOT contain stack traces, SQL, internal hostnames, secrets, prompts or personal data (RFC 9457 security guidance; see 13-data-classification-and-privacy.md) (API-011).
      10. Machine-readable branching MUST use an extension member `code` (stable, documented) and, for validation, an `errors` array with JSON pointer and `code`; extension members need at least three characters and start with a letter (API-012).
      11. The problem-details exception handler MUST live in `api/errors.py` and be the only place that maps exceptions to responses (API-014).
      12. List endpoints MUST paginate with a bounded `limit` (documented default and maximum) and an opaque cursor; unbounded lists MUST NOT exist (API-017).
      13. Long-running work MUST return 202 with a status resource rather than holding the request open beyond the API deadline (API-019).
      14. APIs MUST be versioned in the URL path (`/v1/`) or a documented header, chosen once org-wide (API-020).
      15. Consumers MUST ignore unknown response fields (tolerant reader); providers MUST NOT reuse removed field names with new meaning (API-023).
      16. Change `docs/api/openapi.yaml` first with `scripts/export_openapi.py`; the contract test fails on drift (API-001, API-002).
      17. The liveness and readiness probes are the declared unauthenticated exception (docs/FINDINGS.md F-08).
  - name: "Architecture boundaries and ADRs"
    fileFilters:
      - ".importlinter"
      - "tests/unit/architecture/**"
      - "docs/adr/**"
      - "src/*/adapters/**"
    instructions: |
      1. Agents MUST NOT edit import-linter configuration, `tests/unit/architecture/`, or add `ignore_imports` entries to make a violation pass; changes to these paths MUST be owned in `CODEOWNERS` by the architecture owner (ARC-019).
      2. Each `ignore_imports` entry MUST carry a comment with an ADR or waiver reference and an expiry date (21-exceptions-and-waivers.md); stale ignores MUST be removed (import-linter reports unmatched ignores as errors by default) (ARC-020).
      3. Each service MUST own its data store; no service MAY read or write another service's database, queue or storage directly (ARC-023).
      4. Services MUST communicate only through versioned APIs or events (17-api-and-contracts.md); shared libraries MAY hold technical utilities but MUST NOT hold domain logic or models used across services (ARC-024).
      5. Outbound calls to other services MUST live in `adapters/http_clients` behind a port, with timeouts and retry policy per 18-reliability-and-operations.md (ARC-027).
      6. An ADR MUST be written for: a new service, a new data store, a new external dependency or vendor SDK, a new top-level package, an LLM pattern (RAG, agent, workflow), an autonomy rung change (04-engineering-principles.md), and any boundary exception (ARC-029).
      7. ADRs MUST live in `docs/adr/NNNN-short-title.md`, use the MADR-style template below, and be numbered sequentially; an accepted ADR MUST NOT be edited except for its status, and a change of direction MUST be a new ADR that supersedes it (ARC-030).
      8. A human decision-maker MUST set an ADR's status to `accepted`; AI agents MAY draft ADRs and MUST NOT accept them (ARC-031).
      9. An ADR MUST list at least two considered options including "do nothing" or the simplest option, state consequences, and state how the decision will be verified (a fitness test, an eval, a metric) (ARC-033).
      10. Copy `docs/adr/0000-adr-template.md` for a new ADR.
  - name: "Domain and application code"
    fileFilters:
      - "src/*/domain/**"
      - "src/*/application/**"
    instructions: |
      1. LLM calls, prompt assembly and output parsing MUST NOT appear in `domain/`; a business rule that can be written as deterministic code MUST be written as deterministic code in `domain/` (see 04-engineering-principles.md) (ARC-014).
      2. Dependency injection SHOULD be by constructor or function parameter against a Protocol; global singletons and module-level clients SHOULD NOT be used (ARC-010).
      3. Names MUST state intent in domain language (`PremiumQuote`, `is_eligible_for_waiver`), functions MUST be verbs or questions, and the same concept MUST have the same name everywhere (CLN-010).
      4. Names SHOULD describe domain concepts, not technology (`ClaimRepository`, not `SqlHelper`), and SHOULD NOT use `utils`, `helpers`, `manager` or `misc` (STR-019).
      5. Domain values SHOULD be immutable (frozen dataclasses or frozen models); module-level mutable state MUST NOT be used, and `global` MUST NOT appear (`PLW0603` is in the selected `PL` set) (CLN-008).
      6. Failure MUST be signalled by raising a specific domain exception (defined in `domain/errors.py` or `application`); functions MUST NOT return `None`, `-1`, empty strings or `False` to mean "something went wrong" (CLN-019).
      7. A function SHOULD do one thing, read top to bottom, and use early returns and guard clauses instead of nesting beyond three levels (CLN-005).
      8. A regulatory or business-rule comment MUST cite the rule source by identifier or document name so a reviewer can check it; MUST NOT invent a citation (CLN-031).
      9. Money is integer cents, never floats; add Hypothesis property tests for invariants (TST-020).
  - name: "Logging and telemetry"
    fileFilters:
      - "src/**"
    instructions: |
      1. Logging and telemetry MUST be configured in exactly one module (`observability.py`), called once from the composition root (OBS-002).
      2. Log events MUST use a stable snake_case event name as the message (`policy_lookup_failed`) with data in key-value fields, never interpolated into the string (OBS-005).
      3. Exceptions MUST be logged once, at the boundary that handles them, with the traceback in a structured field (`exc_info`) (OBS-008).
      4. Key-name redaction is a safety net, not a control: code MUST NOT pass request bodies, prompts, documents or customer identifiers into log fields in the first place (OBS-010).
      5. Span attributes, metric labels and log fields MUST NOT contain personal, health, financial or beneficiary data or secrets (OBS-011).
      6. Metric label sets MUST be bounded (enumerations, route templates, status classes) (OBS-021).
      7. Log levels: ERROR only for failures needing action, WARNING for degraded-but-served, INFO for business events, DEBUG off in production by default (OBS-007).
      8. Operational logs MUST NOT be used as the audit trail; they may be sampled, rotated or dropped (OBS-029).
      9. Regulated decisions MUST write an audit record separate from application logs, containing who or what acted, which model and prompt version, inputs by reference (not content), outcome, timestamp and correlation ID (OBS-027).
      10. Exactly one distro or manual SDK initialisation MUST exist per process (OBS-014).
      11. Tracing export is not set up in this template; do not initialise an OpenTelemetry distro without the ADR.
  - name: "Python style"
    instructions: |
      1. Run `make fmt` after edits and `make check` before declaring work done.
      2. Type every function; `mypy --strict` must pass. A `# type: ignore[code]` needs a reason comment.
      3. Keep functions small and named for the domain (`approve_claim`, not `process`).
      4. No `print`, no bare `except`, no mutable default arguments.
      5. Raise typed domain errors from `domain/errors.py`; never return error strings.
  - name: "Tests and evals"
    fileFilters:
      - "tests/**"
      - "evals/**"
    instructions: |
      1. Write the failing test first, then the code. Never weaken, skip or delete a test to make it pass.
      2. Unit tests never call the network or a live model; inject the fake model client.
      3. Test data is synthetic. Never paste real customer data or real identifiers.
      4. Mirror the source tree: `tests/unit/<layer>/test_<module>.py`; name tests `test_<behavior>`.
      5. Mark slow or external tests with `@pytest.mark.integration`; model-quality checks with `@pytest.mark.eval`.
