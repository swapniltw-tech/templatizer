# Implements TEC-022 (SHOULD): ruff, mypy, gitleaks. Convenience only; CI is the enforcement.
# VERIFY: doc 00 validated this YAML with `pre-commit validate-config` but did not run the hooks;
# run `pre-commit run --all-files` once. The gitleaks rev is the latest tag seen on 2026-11-25.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
