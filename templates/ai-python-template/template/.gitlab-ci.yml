# Implements: CIC-001 (runs make targets, pipeline must pass to merge), CIC-002 (MR + default branch),
# CIC-003 (eval on AI/eval changes), CIC-004 (scanners), CIC-007 (pinned images), CIC-008 (timeout,
# interruptible), TEC-002/TEC-010 (make check on two Python minors), TST-048/TST-049 (blocking tests,
# JUnit + Cobertura artifacts), IGN-016 and AGT-001/AGT-010/AGT-014/AGT-016/AGT-018/AGT-031 (run inside make lint, PRC-015),
# STR-027/STR-028 (commit subjects). Skeleton: doc 16; test job: doc 24.
#
# Keywords below were checked against docs.gitlab.com on 2026-11-25 (junit list, coverage_report,
# coverage regex, include templates, merge request variable). NOT VERIFIED: the file was not run in
# GitLab and not linted with GitLab's CI lint (no instance access).
# ASSUMPTION: (F4) GitLab tier and runners. Everything in <angle brackets> is a placeholder.
# ASSUMPTION: (F4) the job images below already contain uv, make and git (no approved image exists yet).
# TODO: image-content check (IGN-015), SBOM/scan/sign (DEP-024, CIC-031), deploy and Terraform jobs
# (CIC-021..CIC-029), scheduled mutation/e2e/performance jobs (TST-050), central pinned include (CIC-006).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  timeout: 20 minutes

stages: [validate, test, eval, security, build]

include:
  # Template paths per docs.gitlab.com (checked 2026-11-25): both run in Free, Premium and Ultimate;
  # MR widgets and vulnerability reports need Ultimate. Doc 16's `Security/...` paths are outdated.
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  HYPOTHESIS_PROFILE: gate  # TST-024: derandomized property tests in CI (profile defined in tests/conftest.py)
  UV_PYTHON_DOWNLOADS: "0"  # use the interpreter in the job image so the matrix minor is the one tested

.uv-job:
  before_script:
    - uv --version
    - export UV_PYTHON="$PYTHON_MINOR"
    - make install

# TEC-002/TEC-010: the same `make check` developers run, on the two newest minors, as two explicit
# jobs (one digest per minor satisfies CIC-007; docs/FINDINGS.md F-09). A `parallel: matrix` with a
# variable in `image:` was left out because docs.gitlab.com does not confirm matrix variables there.
.check:
  extends: .uv-job
  stage: test
  script:
    - make check
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'  # matches the pytest-cov TOTAL line of this template
  artifacts:
    when: always
    reports:
      junit: [reports/unit.xml, reports/integration.xml]
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: false

check-py314:
  extends: .check
  image: <approved-registry>/python-uv@sha256:<digest-3.14>
  variables:
    PYTHON_MINOR: "3.14"

check-py315:
  extends: .check
  image: <approved-registry>/python-uv@sha256:<digest-3.15>
  variables:
    PYTHON_MINOR: "3.15"

# STR-027/028: commit subjects (needs a git range, so CI only; every other repo check runs in make check,
# PRC-015). TODO: a local equivalent, for example `python scripts/check_commit_msg.py origin/main..HEAD`.
commit-subjects:
  extends: .uv-job
  stage: validate
  image: <approved-registry>/python-uv@sha256:<digest-3.14>
  variables:
    PYTHON_MINOR: "3.14"
    GIT_DEPTH: "0"  # full history so the commit range below resolves
  script:
    - uv run --locked python scripts/check_commit_msg.py "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
  rules:
    # CI_MERGE_REQUEST_DIFF_BASE_SHA exists in merge request pipelines only (docs.gitlab.com, 2026-11-25).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# CIC-003: model-quality evals when eval or AI code changes. Synthetic datasets only.
evals:
  extends: .uv-job
  stage: eval
  image: <approved-registry>/python-uv@sha256:<digest-3.14>
  variables:
    PYTHON_MINOR: "3.14"
  script:
    - make eval
  rules:
    - changes: [prompts/**/*, registry/**/*, evals/**/*, src/**/ai/**/*]

# CIC-004: dependency audit and secret scan (make security). Gitleaks must exist in the image.
dependency-audit:
  extends: .uv-job
  stage: security
  image: <approved-registry>/python-uv@sha256:<digest-3.14>
  variables:
    PYTHON_MINOR: "3.14"
  script:
    - make security
  allow_failure: false

# Build only on the default branch (doc 16). TODO: choose the image builder (kaniko, buildah, ...).
build-image:
  stage: build
  image: <approved-registry>/image-builder@sha256:<digest>
  script:
    - make build
    # TODO: SBOM, image scan, sign (CIC-031, DEP-024); tools undecided.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
