    enforcement: "lint"
    tool: "ruff PERF"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Simple accumulation loops SHOULD be comprehensions or built-ins (`PERF401` and related rules)."
  - id: "CLN-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Names MUST state intent in domain language (`PremiumQuote`, `is_eligible_for_waiver`), functions MUST be verbs or questions, and the same concept MUST have the same name everywhere."
  - id: "CLN-011"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff A001,A002,N"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Code MUST NOT shadow built-ins (`id`, `type`, `input`, `list`) and MUST follow PEP 8 naming (pep8-naming, `N` rules)."
  - id: "CLN-012"
    level: "MUST"
    enforcement: "ci"
    tool: "mypy"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "All code MUST pass `mypy --strict` with the repo config; baseline settings are owned by [09-structure-and-format.md](./09-structure-and-format.md). `warn_unreachable` and the error codes `ignore-without-code`, `redundant-expr` and `truthy-bool` SHOULD be enabled (tested)."
  - id: "CLN-013"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff ANN401"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`Any` MUST NOT appear in public signatures; use a Protocol, `TypedDict`, a generic or a concrete model."
  - id: "CLN-014"
    level: "MUST"
    enforcement: "ci"
    tool: "mypy"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`# type: ignore` MUST name the error code and carry a one-line reason; `typing.cast` MUST NOT be used to silence a mismatch that a real fix would remove."
  - id: "CLN-015"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff UP"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Code MUST use modern syntax for the target Python (`list[str]`, `X | None`, `match` where it clarifies); target version follows [00-tech-stack.md](./00-tech-stack.md)."
  - id: "CLN-016"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff E722,BLE001"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Code MUST NOT use bare `except:` or `except Exception:` except at a process boundary that logs and re-raises or converts to a defined error response."
  - id: "CLN-017"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff S110,SIM105"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Exceptions MUST NOT be swallowed (`try`/`except`/`pass`); handle, translate or let them propagate."
  - id: "CLN-018"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff B904"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A translated exception MUST be raised with `raise NewError(...) from err` (or `from None` with a reason)."
  - id: "CLN-019"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Failure MUST be signalled by raising a specific domain exception (defined in `domain/errors.py` or `application`); functions MUST NOT return `None`, `-1`, empty strings or `False` to mean \"something went wrong\"."
  - id: "CLN-020"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff S101"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`assert` MUST NOT be used in `src/` for input or business validation (tests excepted); validate explicitly and raise."
  - id: "CLN-021"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff B006"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Mutable default arguments MUST NOT be used."
  - id: "CLN-022"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff DTZ"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Datetimes MUST be timezone-aware and obtained from an injected clock, not `datetime.now()` or `utcnow()` in logic (a `TID251` ban entry on `datetime.datetime.utcnow` is in the reference config)."
  - id: "CLN-023"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff F401,F841,ARG"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Unused imports, variables, arguments and private functions MUST be removed, not commented out or silenced."
  - id: "CLN-024"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff ERA001"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Commented-out code MUST NOT be committed; version control is the history."
  - id: "CLN-025"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff T201"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`print` MUST NOT be used in `src/`; use the structured logger ([10-logging-observability.md](./10-logging-observability.md))."
  - id: "CLN-026"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff RUF100"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A `# noqa` MUST name its rule code, carry a reason, and MUST still be needed (unused `noqa` is an error with `RUF100`)."
  - id: "CLN-027"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Comments MUST explain why (a constraint, a business rule source, a non-obvious trade-off), never what the next line does; a comment that restates code MUST be deleted and the code renamed if it was unclear."
  - id: "CLN-028"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Comments MUST NOT contain narration of the edit (`# added`, `# now handles X`, `# fixed`), author or date stamps, ticket history, emoji, banners, or statements that the code was AI-generated; history belongs in version control."
  - id: "CLN-029"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff FIX002"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`TODO`, `FIXME` and `XXX` comments MUST NOT be merged (`FIX002` flags every one); open a ticket instead. `TD002` and `TD003` (author and issue link) are in the selected set for any suppressed case."
  - id: "CLN-030"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Public functions and classes SHOULD have a one-line docstring stating purpose and non-obvious behavior (units, side effects, raised errors); docstrings MUST NOT repeat parameter types that the annotations already give."
  - id: "CLN-031"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A regulatory or business-rule comment MUST cite the rule source by identifier or document name so a reviewer can check it; MUST NOT invent a citation."
  - id: "CLN-032"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Lint, type and complexity configuration (`[tool.ruff*]`, `[tool.mypy]`) MUST NOT be loosened to make code pass; changes require human approval via `CODEOWNERS`, and agents MUST NOT edit them for that purpose."
  - id: "CLN-033"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A per-file ignore or `noqa` for a rule in the limits table MUST have a waiver reference ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md))."
  - id: "CLN-034"
    level: "MUST"
    enforcement: "ci"
    tool: "make lint"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`make lint` MUST run `ruff check` and `make typecheck` MUST run `mypy`; CI MUST fail on any finding, with no baseline file that hides existing violations."
  - id: "CLN-035"
    level: "MAY"
    enforcement: "manual"
    tool: "radon"
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "radon (`radon cc -s -n C src`) MAY be run as a cross-check on complexity, but Ruff `C901` is the gate. VERIFY: radon's thresholds and maintenance status before adopting it in CI."
  - id: "CLN-036"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Reviewers MUST check every AI-authored MR against the anti-pattern table below, and the author MUST remove findings before review."
  - id: "CLN-037"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Imports, function names and library calls MUST exist in the pinned dependency versions; unresolved or invented APIs are failures of `mypy` or tests and MUST NOT be \"fixed\" by adding `# type: ignore` or `Any` ([20-dependencies-and-licensing.md](./20-dependencies-and-licensing.md) covers hallucinated packages)."
  - id: "CLN-038"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "11-clean-code.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "The diff MUST be limited to the task: no drive-by reformatting, renames, new files or dependencies unrelated to the request."
  - id: "GOV-001"
    level: "MUST"
    enforcement: "review"
    tool: "MR template"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Every AI use case, model, and agent MUST have an approved intake record (purpose, data classes, users, decision impact, proposed tier) before it is built beyond a prototype."
  - id: "GOV-002"
    level: "MUST"
    enforcement: "ci"
    tool: "registry-check"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Every deployed model, prompt-based agent and tool MUST have an inventory entry with a unique inventory ID, and the service repository MUST reference that ID in its manifest (see [25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md))."
  - id: "GOV-003"
    level: "MUST"
    enforcement: "ci"
    tool: "registry-check"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "The inventory entry MUST record: owner, tier, purpose and non-goals, model deployment and pinned version, data classes handled, third-party vendor, last validation date, and next review date."
  - id: "GOV-004"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Prototypes and sandboxes MUST NOT process real customer data or Tier 1 production decisions; promotion to production requires a completed intake record."
  - id: "GOV-005"
    level: "SHOULD"
    enforcement: "ci"
    tool: "registry-check"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "The pipeline SHOULD export the inventory as a machine-readable artifact on each release so Model Risk can reconcile it with the enterprise inventory."
  - id: "GOV-006"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Every inventory entry MUST carry a risk tier from the table above, assigned by the owner and confirmed by AI Governance."
  - id: "GOV-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Any use case that influences coverage, pricing, underwriting or claims outcomes MUST be Tier 1 and MUST keep a human as the decision maker; an agent MUST NOT autonomously deny, rescind or reprice."
  - id: "GOV-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "The tier MUST be re-assessed when the model, prompt, tool set, data classes, user population or decision impact changes."
  - id: "GOV-009"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "A tier SHOULD NOT be lowered without written approval from AI Governance; the approval is attached to the inventory entry."
  - id: "GOV-010"
    level: "MUST"
    enforcement: "ci"
    tool: "CODEOWNERS check"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Every system in the inventory MUST name one accountable owner (a role and a person) and one technical lead; the owner field MUST match the repository CODEOWNERS file."
  - id: "GOV-011"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Ownership transfer MUST be recorded in the inventory before the previous owner leaves; orphaned systems MUST be suspended or retired within an agreed period (`ASSUMPTION:` 30 days, confirm with Model Risk)."
  - id: "GOV-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "An AI coding agent MUST NOT be recorded as an owner, approver or reviewer of any governance artifact."
  - id: "GOV-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Tier 1 and Tier 2 systems MUST be reviewed by someone independent of the builders before first production release, covering conceptual soundness, data fitness, eval results and known limitations."
  - id: "GOV-014"
    level: "MUST"
    enforcement: "ci"
    tool: "eval gate"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Eval thresholds set for a system MUST be met in CI and the result MUST be stored as evidence; thresholds and datasets are defined in [14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md)."
  - id: "GOV-015"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Production monitoring MUST track quality, drift, safety events, cost and incident counts per inventory ID, with alert thresholds agreed with the owner (see [10-logging-observability.md](./10-logging-observability.md) and [18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "GOV-016"
    level: "MUST"
    enforcement: "ci"
    tool: "MR approval rules"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "A change to a model version, prompt, tool definition, guardrail or retrieval source in a Tier 1 or Tier 2 system MUST go through an MR with CODEOWNERS approval and a re-run of required evals before deployment."
  - id: "GOV-017"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Tier 1 systems SHOULD be revalidated at least annually and Tier 2 at least every two years (`ASSUMPTION:` cadence, confirm with Model Risk)."
  - id: "GOV-018"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Retired systems MUST be decommissioned formally: traffic removed, credentials revoked, data deleted per retention, and the inventory entry closed with a date."
  - id: "GOV-019"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "A new third-party AI service, model provider, SDK that sends data off-platform, or MCP server MUST be approved through third-party risk management before use; the approval ID is recorded in the inventory."
  - id: "GOV-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "The approved LLM platform is Microsoft Foundry (Azure OpenAI); any other provider MUST have a waiver per [21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md) and a completed third-party approval. Which Foundry models are approved is unresolved (F2): `ASSUMPTION:` only models on the governance-approved list in [15-llm-and-model-governance.md](./15-llm-and-model-governance.md) may be deployed."
  - id: "GOV-021"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "The vendor assessment MUST cover the B-10 topics: due diligence on technology and cyber risk, incident notification terms, subcontractors, data location, exit and portability, and concentration risk."
  - id: "GOV-022"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Each third-party AI dependency SHOULD have a documented exit plan (alternative deployment, degradation path) reviewed when the vendor or model changes."
  - id: "GOV-023"
    level: "MUST"
    enforcement: "ci"
    tool: "artifact retention"
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Release pipelines MUST retain, per inventory ID and release: eval results, scan reports, SBOM, approval records, model/prompt versions and deployment record."
  - id: "GOV-024"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Decision-influencing outputs of Tier 1 and Tier 2 systems MUST be traceable to the model version, prompt version, inputs (by reference or redacted), tool calls and human reviewer, with an audit log that is append-only for its retention period."
  - id: "GOV-025"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Evidence retention periods MUST follow the corporate records schedule (`ASSUMPTION:` `<records-retention-schedule>`); engineering MUST NOT set shorter periods for governance evidence."
  - id: "GOV-026"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "A material incident involving an AI system (harmful output, data exposure, unauthorized action) MUST be reported to the owner and AI Governance, and a technology/cyber incident MUST follow the corporate OSFI incident reporting process (VERIFY: OSFI Technology and Cyber Security Incident Reporting Advisory timelines)."
  - id: "GOV-027"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "12-governance-and-compliance.md"
    owner: "Head of AI Governance / Model Risk (with Compliance)"
    retired: false
    text: "Each MR that changes governance-relevant behaviour SHOULD cite the rule IDs it satisfies in its description so reviewers and auditors can trace controls."
  - id: "DAT-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Every dataset, table, index, bucket, topic and prompt template MUST carry a classification label (Public, Internal, Confidential, Restricted) in its manifest, README or resource tags."
  - id: "DAT-002"
    level: "MUST"
    enforcement: "ci"
    tool: "terraform tag check"
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Every Azure resource storing Confidential or Restricted data MUST have a `data-classification` tag set by Terraform, and the CI policy check MUST fail when it is missing."
  - id: "DAT-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Data flows MUST conform to the data-flow matrix; any `P` cell requires an approved PIA and an inventory entry before the first production use."
  - id: "DAT-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Unlabelled data MUST be treated as Restricted."
  - id: "DAT-005"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Services SHOULD minimise fields sent to a model: select needed fields explicitly, never send whole records or whole documents when an excerpt suffices."
  - id: "DAT-006"
    level: "MUST"
    enforcement: "ci"
    tool: "egress policy"
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Prompts containing Confidential or Restricted data MUST only be sent to an approved Foundry deployment in an approved Canadian region over private networking; no other endpoint MAY receive them."
  - id: "DAT-007"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "A pre-call guard MUST block or redact data above the caller's allowed class before it reaches the model client; the guard MUST have unit tests with synthetic positives (see [24-testing-standards.md](./24-testing-standards.md))."
  - id: "DAT-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Prompt templates and system prompts MUST NOT contain personal information, secrets or customer examples; use placeholders and synthetic few-shot examples."
  - id: "DAT-009"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Model outputs MUST be classified at the highest class of any input they were derived from and stored, logged and shared accordingly."
  - id: "DAT-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Customer data MUST NOT be used to fine-tune or train any model without an approved PIA, governance approval and documented consent or legal basis."
  - id: "DAT-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Retrieval-augmented systems MUST classify indexed content and enforce per-user access at query time as specified in [19-rag-and-retrieval.md](./19-rag-and-retrieval.md)."
  - id: "DAT-012"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Application logs, traces and metric labels MUST NOT contain Restricted data and MUST redact Confidential data before leaving the process or the collector."
  - id: "DAT-013"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Prompt and response content capture in telemetry MUST be disabled by default in production; enabling it for a service requires a recorded approval and treats the telemetry store as Restricted."
  - id: "DAT-014"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Redaction MUST be covered by tests that feed synthetic identifiers (names, emails, phone numbers, policy numbers) through the logging pipeline and assert none appear in output."
  - id: "DAT-015"
    level: "MUST"
    enforcement: "ci"
    tool: "secret/PII scan"
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Real customer data MUST NOT exist in repositories, fixtures, golden datasets, CI variables, CI artifacts or non-production environments; the pipeline MUST scan for known identifier patterns."
  - id: "DAT-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Test and eval data MUST be synthetic or irreversibly anonymised with a documented method; the generator and seed MUST be committed."
  - id: "DAT-017"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Synthetic data SHOULD preserve schema, edge cases and EN/FR variants, and SHOULD be labelled `synthetic` in dataset metadata."
  - id: "DAT-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Developers and AI coding agents MUST NOT paste production records into prompts, issues, MR comments or chat tools."
  - id: "DAT-019"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "A PIA MUST be completed and approved before any AI system processes personal information in production, and re-done when purpose, data classes, vendor, region or model changes."
  - id: "DAT-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "The PIA MUST state: purposes, data classes, legal basis or consent, retention, locations of processing and storage, subprocessors, foreign-access risk, automated-decision impact, and safeguards."
  - id: "DAT-021"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Personal information MUST NOT leave Quebec (including to another Canadian province) for processing, storage or inference until the PIA has assessed the transfer. VERIFY: s. 17 of the Quebec private-sector Act and any applicable regulation."
  - id: "DAT-022"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Where a system makes or materially informs a decision about an individual using automated processing, the design MUST support informing the individual and providing human review on request. VERIFY: Quebec private-sector Act s. 12.1 and PIPEDA guidance on automated decision-making."
  - id: "DAT-023"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Each system MUST name an accountable owner for personal information it handles (PIPEDA accountability principle) and the owner MUST match the inventory entry."
  - id: "DAT-024"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Every store of personal information (database, blob, index, cache, evaluation set, trace store) MUST have a documented retention period no longer than needed for the purpose, set from the corporate records schedule (`ASSUMPTION:` `<records-retention-schedule>`)."
  - id: "DAT-025"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Deletion MUST propagate to derived stores (search indexes, embeddings, caches, summaries, trace stores); a test or runbook step MUST demonstrate it."
  - id: "DAT-026"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Systems MUST support locating and exporting a given individual's personal information to answer access, correction and deletion requests within the corporate timeline (VERIFY: statutory timelines with Legal)."
  - id: "DAT-027"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "Services SHOULD tokenize direct identifiers at ingestion so downstream AI components work on tokens, with the mapping held in a restricted store."
  - id: "DAT-028"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "13-data-classification-and-privacy.md"
    owner: "Chief Privacy Officer (with Information Security)"
    retired: false
    text: "A suspected privacy breach (disclosure of personal information to an unauthorised party, including via a prompt or log) MUST be reported to the Privacy Office immediately; the Privacy Office decides on regulator and individual notification. VERIFY: PIPEDA breach-of-security-safeguards reporting thresholds and Quebec incident register obligations."
  - id: "EVL-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every AI system MUST have a golden dataset stored under `evals/datasets/`, covering normal, edge, adversarial and EN and FR cases (see [22-localization-and-accessibility.md](./22-localization-and-accessibility.md) for FR)."
  - id: "EVL-002"
    level: "MUST"
    enforcement: "ci"
    tool: "secret and PII scan"
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Eval datasets MUST be synthetic or fully de-identified per [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md); real customer data MUST NOT enter datasets, prompts, judge inputs or eval logs."
  - id: "EVL-003"
    level: "MUST"
    enforcement: "ci"
    tool: "dataset-lock check"
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Datasets MUST be versioned (semver) and content-hashed; `evals/<suite>/thresholds.yaml` MUST record the dataset path, version and SHA-256, and CI MUST fail on mismatch."
  - id: "EVL-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every dataset case MUST have a stable `id`, an expected outcome or rubric, a tag (`normal`, `edge`, `adversarial`, `fr`, `en`) and a provenance note (who wrote it, how generated)."
  - id: "EVL-005"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Production incidents and human-review disagreements SHOULD be converted into new de-identified regression cases within one sprint."
  - id: "EVL-006"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A dataset used to tune prompts MUST be separate from the held-out set used for gating; gating sets MUST NOT be shown to the prompt author or the coding agent."
  - id: "EVL-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Use deterministic checks first (schema validation, exact match, regex, set overlap, tool-call assertions); an LLM judge MUST be used only for properties that cannot be checked deterministically."
  - id: "EVL-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "An LLM judge MUST be calibrated against a human-labelled sample (at least 50 cases, two labelers on a subset) and the agreement metric and date MUST be stored with the eval results."
  - id: "EVL-009"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Judges MUST use a pinned deployment version, temperature 0 where supported (`VERIFY:` per deployment), a versioned rubric file, and structured output; judge prompt changes MUST re-run calibration."
  - id: "EVL-010"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "The judge SHOULD be a different deployment from the system under test, and pairwise comparisons SHOULD randomize order, to limit self-preference and position bias; length and verbosity bias MUST be checked in calibration."
  - id: "EVL-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A judge verdict MUST NOT be the only evidence for any regulated decision-support behavior; pair it with deterministic checks and human sampling."
  - id: "EVL-012"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab `make eval`"
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every repo with an AI component MUST provide `make eval`, and the GitLab CI pipeline MUST run it on any MR that changes prompts, tool schemas, retrieval config, model deployment references or eval files; a failing gate MUST block merge."
  - id: "EVL-013"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Gates MUST fail closed: a missing metric, missing dataset, fewer cases than `min_cases`, or an eval run that errored counts as a failure, never a skip."
  - id: "EVL-014"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Non-deterministic gates MUST state `n_runs` (default 3) and the aggregation (mean or worst-of); flaky evals MUST be fixed or quarantined with an owner and expiry, not retried until green."
  - id: "EVL-015"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Evals MUST re-run on any change to: prompt, tool or output schema, retrieval or chunking config, guardrail config, model deployment or version, judge rubric, or the dataset. A model deprecation or migration MUST re-run the full suite."
  - id: "EVL-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "An agent MUST NOT lower a threshold, delete or relabel a case, or edit `evals/<suite>/thresholds.yaml` to make a gate pass; threshold changes need an owner-approved MR (CODEOWNERS) with rationale."
  - id: "EVL-017"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Live-model eval cost per run SHOULD have a budget (tokens or currency) enforced in the job, and MR pipelines SHOULD use a smaller tagged subset while nightly runs use the full set."
  - id: "EVL-018"
    level: "MUST"
    enforcement: "ci"
    tool: "registry-check"
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every registered tool MUST have an eval suite with a dataset, thresholds and a result link referenced from its manifest (field layout is in [25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md)); a tool without a passing suite MUST NOT reach `approved`."
  - id: "EVL-019"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A tool suite MUST cover: valid inputs, schema-invalid inputs, boundary values, error paths, idempotency (where declared), permission-denied, and adversarial arguments (injection strings in free-text fields)."
  - id: "EVL-020"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "An agent suite MUST measure task success, correct tool selection, no calls to tools outside the allow-list, argument validity, step and cost budgets, and correct escalation to a human when required."
  - id: "EVL-021"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Any change to a tool's input or output schema or description, or to an agent's prompt, allowed tools or model deployment, MUST re-run that tool's or agent's suite before merge."
  - id: "EVL-022"
    level: "SHOULD"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Agent evals SHOULD assert on the trajectory (ordered tool calls and arguments), not only the final answer."
  - id: "EVL-023"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Each suite MUST declare thresholds in `evals/<suite>/thresholds.yaml` per autonomy rung it can run at; the rung named in the agent manifest MUST exist in that file and its gate MUST pass before deployment. [04-engineering-principles.md](./04-engineering-principles.md) owns which evidence categories each rung needs; this doc owns the file format and the gate. Numeric thresholds are set per system by its owner and approved by AI governance (ASSUMPTION F17: no org-wide numbers exist yet); an agent MUST NOT choose them for itself."
  - id: "EVL-024"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Thresholds MUST include at least one safety metric (injection resistance or unsafe-action rate) in addition to quality metrics; safety metrics MUST NOT be averaged with quality metrics."
  - id: "EVL-025"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Threshold values SHOULD include a confidence margin: set the bar on the lower bound of the observed score over `n_runs`, not on a single best run."
  - id: "EVL-026"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every agent and every system that reads untrusted text (documents, email, retrieved chunks, tool output) MUST run a prompt-injection suite covering direct, indirect (in retrieved or tool content), and exfiltration attempts; threat definitions are owned by [02-security.md](./02-security.md)."
  - id: "EVL-027"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Injection suites MUST assert on actions, not wording: no unauthorized tool call, no data from another user or classification, no disclosure of system prompt or secrets."
  - id: "EVL-028"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A human red-team exercise SHOULD run before first production release of a high-risk system and after major changes; findings MUST be added to the dataset."
  - id: "EVL-029"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Production systems MUST sample live traffic for online evaluation (safety, groundedness and quality metrics), with the sample rate and redaction applied per [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md) and [10-logging-observability.md](./10-logging-observability.md)."
  - id: "EVL-030"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Online eval metrics MUST have alert thresholds and a named responder; a breach MUST trigger the response path defined in [18-reliability-and-operations.md](./18-reliability-and-operations.md)."
  - id: "EVL-031"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Humans SHOULD review a random sample plus all low-scoring items on a fixed cadence (ASSUMPTION: weekly at launch, monthly once stable); reviewer labels feed calibration (EVL-008) and the dataset (EVL-005)."
  - id: "EVL-032"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Drift MUST be monitored: compare online scores and input distribution against the gating baseline; a model version change by the platform MUST be detected by pinned deployment checks (see [15-llm-and-model-governance.md](./15-llm-and-model-governance.md))."
  - id: "EVL-033"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Each gating run MUST store a result record: git SHA, dataset version and hash, thresholds file hash, prompt hashes, model deployment and version, judge version, metrics, per-case results, pass or fail, timestamp. Retention period follows [12-governance-and-compliance.md](./12-governance-and-compliance.md) (ASSUMPTION: confirm with Compliance, F1)."
  - id: "EVL-034"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "14-evals-and-testing-ai.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Result records MUST be stored as GitLab job artifacts (`expire_in` set to at least the retention period, or exported to the audit store) and MUST be written without PII."
  - id: "LLM-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Only models on the approved list below MAY be deployed. Until AI governance fills the list (F2), no model is approved for production and every use is a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md)). ASSUMPTION: F2 open."
  - id: "LLM-002"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Adding a model to the approved list MUST follow the intake process: vendor and terms review ([12-governance-and-compliance.md](./12-governance-and-compliance.md)), data-handling and residency check, evals on our own tasks, security review, and AI governance sign-off recorded in the inventory."
  - id: "LLM-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The approved list MUST state per model: allowed deployment types (see [23-azure-foundry-standards.md](./23-azure-foundry-standards.md)), maximum data class, allowed use-case risk tiers, languages tested (English and French), and lifecycle stage and retirement date from the Models API."
  - id: "LLM-004"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Services MUST reference models only by the approved entry (placeholder `<chat-deployment>` style names in docs; real deployment names in config), never by a model name hard-coded in source."
  - id: "LLM-005"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Models in Preview lifecycle stage SHOULD NOT be approved for production; preview models are force-upgraded or retired with at least 30 days notice."
  - id: "LLM-006"
    level: "MUST"
    enforcement: "ci"
    tool: "terraform plan check"
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Production deployments MUST pin an explicit model version; floating aliases and \"latest\" MUST NOT be used. The agent manifest `model_version` MUST match the deployed version."
  - id: "LLM-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "A change of model, model version, deployment type, sampling parameters or system prompt is a **model change**: it MUST be an MR, MUST re-run the evals in [14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md) against the thresholds, and MUST record before and after results as evidence."
  - id: "LLM-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "High-risk use cases ([26-ai-use-case-catalog.md](./26-ai-use-case-catalog.md)) MUST NOT change model version without AI governance review of the eval results."
  - id: "LLM-009"
    level: "MUST"
    enforcement: "ci"
    tool: "make eval"
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Sampling parameters (temperature, top-p, seed where supported, maximum output tokens) MUST be set explicitly in configuration and covered by evals; defaults MUST NOT be relied on."
  - id: "LLM-010"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Each approved model SHOULD have a documented fallback model (or \"route to human\") that has passed the same evals."
  - id: "LLM-011"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The platform team MUST own a **retirement calendar** with a named owner role, fed by the scheduled lifecycle job in [23-azure-foundry-standards.md](./23-azure-foundry-standards.md)."
  - id: "LLM-012"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Migration to a replacement MUST start at least 90 days before the retirement date and MUST complete evals, canary and rollout before it. Microsoft names the official replacement roughly 90 to 120 days before retirement and does not extend retirement dates; do not wait for the name to start evaluating."
  - id: "LLM-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Migration MUST evaluate candidates on our own prompts and data comparing quality, latency and cost together, and MUST NOT rely on public benchmarks alone. Prompts and schemas MAY need adaptation and are re-reviewed as code."
  - id: "LLM-014"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "A model with an emergency or security-driven retirement MUST trigger the incident process ([18-reliability-and-operations.md](./18-reliability-and-operations.md)) and the fallback in LLM-010."
  - id: "LLM-015"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "System prompts, few-shot examples, and tool descriptions MUST live in version control (`prompts/`), be loaded by a loader that verifies the hash recorded in the agent manifest, and be reviewed like code."
  - id: "LLM-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Prompt changes MUST be MRs that cite the eval run; prompts MUST NOT be edited in a portal or injected from runtime configuration without a hash entry."
  - id: "LLM-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Prompts MUST NOT contain secrets, personal data, real customer examples or internal system names that are not needed; examples MUST be synthetic ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "LLM-018"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Prompts SHOULD state the task, constraints and output schema; instructions that rely on the model \"being careful\" are not controls. Security-relevant rules MUST also be enforced in code ([02-security.md](./02-security.md))."
  - id: "LLM-019"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "User-supplied and retrieved text MUST be kept structurally separate from instructions and treated as untrusted ([02-security.md](./02-security.md); [19-rag-and-retrieval.md](./19-rag-and-retrieval.md))."
  - id: "LLM-020"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Every LLM output consumed by code MUST be parsed against a schema (pydantic) with explicit failure handling; free-text output MUST NOT drive actions."
  - id: "LLM-021"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Schema validation failure MUST NOT be \"fixed up\" silently; allow a bounded retry (at most the configured count), then fall back or escalate to a human."
  - id: "LLM-022"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Prefer constrained structured output features where the approved model supports them, but still validate. VERIFY: availability per approved model and deployment type."
  - id: "LLM-023"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Outputs that affect a customer, a coverage, pricing or claims outcome MUST include a reason code and source references so a reviewer can verify them ([12-governance-and-compliance.md](./12-governance-and-compliance.md))."
  - id: "LLM-024"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Each service MUST set maximum input and output tokens, a per-request timeout and a per-user or per-job rate limit to bound cost and abuse (threats in [02-security.md](./02-security.md))."
  - id: "LLM-025"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Each service MUST have a monthly cost budget with an owner, alerts at agreed thresholds and an anomaly alert. Quota is not a budget."
  - id: "LLM-026"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Cost per use case MUST be measured (tokens and tool calls per task) and reported with the eval results so model-tier choices can be compared ([05-decision-playbook.md](./05-decision-playbook.md))."
  - id: "LLM-027"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "When the model is unavailable, over quota or fails validation, the service MUST degrade as designed (fallback model, cached or deterministic answer, or human queue) and MUST NOT fabricate an answer ([18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "LLM-028"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Every model call MUST record deployment name, model version, prompt hash, token counts, latency and outcome (redacted per [10-logging-observability.md](./10-logging-observability.md)) so a decision can be reconstructed for audit."
  - id: "LLM-029"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Data sent to a model MUST NOT exceed the model's maximum data class and MUST be minimized to what the task needs; the PIA outcome applies ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "LLM-030"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "15-llm-and-model-governance.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Models MUST NOT be fine-tuned or customized on customer data without AI governance approval, PIA and a data-lineage record. ASSUMPTION: policy on fine-tuning is pending F1."
  - id: "CIC-001"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Every repository MUST have a root `.gitlab-ci.yml` that runs the `make` targets for format, lint, type check, tests and `make security`, and the pipeline MUST pass before an MR can merge."
  - id: "CIC-002"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Pipelines MUST run on merge request events and on the default branch; production deploys MUST run only from the protected default branch or protected tags."
  - id: "CIC-003"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "The `eval` job MUST run when prompts, tool schemas, agent code or model deployment settings change, and MUST fail below the thresholds defined in doc 14."
  - id: "CIC-004"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "SAST, secret detection, dependency scanning and container image scanning MUST run on every MR. Findings above the agreed severity MUST fail the job; `allow_failure: true` on a security job requires a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md))."
  - id: "CIC-005"
    level: null
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: true
    text: "Superseded by DEP-024 and DEP-025 in [20-dependencies-and-licensing.md](./20-dependencies-and-licensing.md); the pipeline job that runs them is defined in this doc's pipeline section."
  - id: "CIC-006"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Common jobs SHOULD come from a central, versioned include (`include: project` pinned to a tag, or a CI/CD component pinned to a version), not copy-pasted per repository. Includes MUST NOT track a moving branch."
  - id: "CIC-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Job images MUST be pinned by digest or immutable tag and come from an approved registry ([20-dependencies-and-licensing.md](./20-dependencies-and-licensing.md)); `latest` MUST NOT be used. (The GitLab Azure example uses `azure-cli:latest`; do not copy that.)"
  - id: "CIC-008"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Jobs SHOULD set `timeout`, `interruptible: true` (for non-deploy jobs) and `retry` only for infrastructure failures, not for failing tests."
  - id: "CIC-009"
    level: "MUST"
    enforcement: "manual"
    tool: "GitLab settings"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "The default branch MUST be protected: no direct pushes, no force pushes, merge only via MR with a passing pipeline and at least one approval from someone other than the author."
  - id: "CIC-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "A `CODEOWNERS` file MUST cover `infra/`, `.gitlab-ci.yml`, `registry/`, `prompts/`, `evals/` and security-relevant paths, with required approval from those owners. `VERIFY:` the tier needed for enforced CODEOWNERS approvals."
  - id: "CIC-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "AI coding agents MUST NOT approve or merge their own MRs and MUST NOT have credentials with Maintainer rights or deploy rights (see [01-codebase-practices.md](./01-codebase-practices.md))."
  - id: "CIC-012"
    level: "MUST"
    enforcement: "manual"
    tool: "GitLab settings"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Production and pre-production environments MUST be protected environments with an allowed-deployers list; production MUST require a deployment approval. Needs Premium or Ultimate; `ASSUMPTION:` licensed."
  - id: "CIC-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Changes to `.gitlab-ci.yml`, included templates and runner configuration MUST be reviewed by the platform team via CODEOWNERS; pipeline definitions MUST NOT be editable by a deploy-job author unreviewed."
  - id: "CIC-014"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Protected CI/CD variables MUST NOT be used for cloud credentials; use OIDC (CIC-016). Any remaining variables MUST be masked and protected and scoped to environments."
  - id: "CIC-015"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Deploy and Terraform jobs MUST NOT use stored client secrets, service principal passwords or personal access tokens for Azure."
  - id: "CIC-016"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Jobs that need Azure MUST obtain a short-lived GitLab ID token via `id_tokens:` with an explicit `aud` and exchange it through a Microsoft Entra federated identity credential (workload identity federation)."
  - id: "CIC-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Federated credentials MUST be scoped narrowly: one app registration or user-assigned managed identity per environment and purpose (plan vs apply), with a subject that pins project, ref and, where available, environment. Wildcard subjects MUST NOT be used for production."
  - id: "CIC-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Plan identities MUST have read-only roles; apply identities MUST be usable only from protected refs or protected environments. `VERIFY:` use `ref_protected` / `environment_protected` custom claims (GitLab 18.7 or later) in the subject or a claims-matching expression."
  - id: "CIC-019"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Prefer GitLab project and namespace IDs over path-based claims in trust policies, because paths change on rename (GitLab docs recommendation)."
  - id: "CIC-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Azure role assignments for pipeline identities MUST be least privilege per [02-security.md](./02-security.md); no subscription-wide Owner."
  - id: "CIC-021"
    level: "MUST"
    enforcement: "ci"
    tool: "terraform"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Infrastructure MUST be defined in Terraform under `infra/`, with `terraform fmt -check` and `terraform validate` in CI. Provider versions MUST be pinned and `.terraform.lock.hcl` committed."
  - id: "CIC-022"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "State MUST be remote in an Azure Storage container using the `azurerm` backend with Microsoft Entra authentication (`use_azuread_auth`, `use_oidc`), one state key per environment and component. The backend supports locking natively; do not disable it."
  - id: "CIC-023"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "The state storage account MUST have no public network access (private endpoint), soft delete and versioning enabled, and data-plane RBAC limited to pipeline identities and a break-glass group. `VERIFY:` exact Azure settings and region policy. State contains sensitive values; treat it as restricted data."
  - id: "CIC-024"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Merge requests MUST run `terraform plan` and publish the plan summary; `apply` MUST run only after merge, on the protected branch, using the saved plan file from a protected environment job. Plan files MUST be restricted artifacts (they may contain secrets) with short expiry."
  - id: "CIC-025"
    level: "MUST"
    enforcement: "ci"
    tool: "checkov or trivy config or GitLab IaC scanning"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "IaC MUST be scanned in every MR. GitLab IaC scanning (KICS-based; `Jobs/SAST-IaC.gitlab-ci.yml`) is allowed; Checkov or Trivy config are alternatives. `VERIFY:` current tool choice with security (F4)."
  - id: "CIC-026"
    level: "SHOULD"
    enforcement: "ci"
    tool: "conftest or OPA"
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Policy-as-code SHOULD evaluate the plan JSON for rules such as: private endpoints required, Canada Central/East only, no public storage, required tags, no wildcard role assignments. `VERIFY:` tool and policy repo."
  - id: "CIC-027"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "A scheduled pipeline SHOULD run `terraform plan -detailed-exitcode` per environment to detect drift and open an issue on non-empty diffs."
  - id: "CIC-028"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Modules MUST be versioned, have an owner and a README with inputs and outputs, and be consumed by pinned version. No secrets in variables files or state outputs marked non-sensitive."
  - id: "CIC-029"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "AI agents MUST NOT run `terraform apply` or `destroy` against shared environments; they may run `fmt`, `validate` and local `plan` without credentials."
  - id: "CIC-030"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Promotion MUST follow dev -> test -> production with the same immutable image digest, built once. Environment differences come from configuration only."
  - id: "CIC-031"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Production images MUST be signed and provenance recorded, and the deploy job MUST verify the signature. `VERIFY:` signing tool (for example cosign) and where signatures are stored."
  - id: "CIC-032"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Every deploy MUST have a tested rollback (redeploy previous digest) and use `resource_group` or equivalent so two deploys to one environment never run concurrently."
  - id: "CIC-033"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Risky changes SHOULD ship behind feature flags with progressive rollout; flags double as kill switches per [18-reliability-and-operations.md](./18-reliability-and-operations.md)."
  - id: "CIC-034"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Database or schema migrations MUST be backward compatible with the previous release (expand then contract)."
  - id: "CIC-035"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "16-cicd-and-deployment.md"
    owner: "Platform Engineering lead (delivery)"
    retired: false
    text: "Deployments MUST record version, digest, approver and pipeline link as deployment evidence retained per doc 12."
  - id: "API-001"
    level: "MUST"
    enforcement: "ci"
    tool: "openapi lint"
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Every HTTP API MUST have an OpenAPI document at `docs/api/openapi.yaml`, reviewed in the same merge request as any behaviour change, and validated by a linter in CI. `VERIFY:` linter choice (for example Spectral) and ruleset."
  - id: "API-002"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "CI MUST fail when the running application's generated schema differs from `openapi.yaml` (drift test), or when a change breaks backward compatibility versus the default branch. `VERIFY:` diff tool."
  - id: "API-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Request and response bodies MUST be pydantic v2 models with explicit types, constraints and examples; handlers MUST NOT accept or return bare `dict`."
  - id: "API-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Domain entities MUST NOT be exposed directly; API schemas live in `api/schemas/` and are mapped to domain models (see doc 03)."
  - id: "API-005"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Every operation MUST have a contract test (schema conformance of responses, including error responses); consumers MUST have consumer-driven or schema-based tests against providers they depend on."
  - id: "API-006"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Resources use plural nouns, standard verbs, `snake_case` or `camelCase` consistently across the org (`ASSUMPTION:` `snake_case`), ISO 8601 UTC timestamps and ISO 4217/ISO 3166 codes."
  - id: "API-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Every operation MUST declare its auth scheme and required scope or role; no operation is public by default. Authn and authz mechanics are owned by [02-security.md](./02-security.md)."
  - id: "API-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Schemas MUST reject unknown fields on requests (`extra=\"forbid\"` or equivalent) and MUST define maximum lengths, array sizes and numeric ranges."
  - id: "API-009"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Error responses MUST use RFC 9457 problem details with media type `application/problem+json`, containing at least `type`, `title`, `status` and a correlation ID extension member (`trace_id`). `status` MUST equal the HTTP status."
  - id: "API-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "`type` MUST be a stable, absolute URI identifying the problem type and resolving to documentation (`VERIFY:` hosting); if no specific type exists, use `about:blank` only for plain HTTP semantics."
  - id: "API-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Problem bodies MUST NOT contain stack traces, SQL, internal hostnames, secrets, prompts or personal data (RFC 9457 security guidance; see [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md)). `detail` is for humans and MUST NOT be parsed by clients."
  - id: "API-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Machine-readable branching MUST use an extension member `code` (stable, documented) and, for validation, an `errors` array with JSON pointer and `code`; extension members need at least three characters and start with a letter."
  - id: "API-013"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Validation errors return 422 (or 400 as chosen once per org, `ASSUMPTION:` 422); 401, 403, 404, 409, 429 and 5xx all use the same problem shape. 429 and 503 SHOULD include `Retry-After` (see [18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "API-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "The problem-details exception handler MUST live in `api/errors.py` and be the only place that maps exceptions to responses."
  - id: "API-015"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Non-idempotent operations that create or change state (POST, and PATCH where not naturally idempotent) MUST accept an `Idempotency-Key` header (`VERIFY:` header name; the IETF draft status) and return the stored result for a repeated key and identical request; a repeated key with a different body MUST return a conflict problem."
  - id: "API-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Idempotency records MUST be stored durably with a documented retention (`ASSUMPTION:` 24 hours or more) and scoped per caller identity."
  - id: "API-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "List endpoints MUST paginate with a bounded `limit` (documented default and maximum) and an opaque cursor; unbounded lists MUST NOT exist."
  - id: "API-018"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Resources that can be modified concurrently SHOULD use `ETag` with `If-Match` and return 412 or 409 on conflict."
  - id: "API-019"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Long-running work MUST return 202 with a status resource rather than holding the request open beyond the API deadline."
  - id: "API-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "APIs MUST be versioned in the URL path (`/v1/`) or a documented header, chosen once org-wide (`ASSUMPTION:` path). Within a version, changes MUST be backward compatible: additive fields and endpoints only."
  - id: "API-021"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Breaking changes (removing or renaming fields, tightening validation, changing types, status codes or semantics) MUST ship as a new major version; the compatibility check (API-002) enforces this."
  - id: "API-022"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Deprecation MUST be announced in the OpenAPI document (`deprecated: true`), in response headers (`VERIFY:` `Deprecation` and `Sunset` headers, RFC status), and to registered consumers, with a sunset date of at least `ASSUMPTION:` 6 months and usage telemetry showing remaining callers."
  - id: "API-023"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Consumers MUST ignore unknown response fields (tolerant reader); providers MUST NOT reuse removed field names with new meaning."
  - id: "API-024"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Every event or message type MUST have a versioned schema (JSON Schema or Avro, `ASSUMPTION:` JSON Schema) in a registry or in-repo `schemas/` directory, validated in CI. `ASSUMPTION:` platform decides whether Azure Schema Registry or Git-only; `VERIFY:`."
  - id: "API-025"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Events MUST carry an envelope with `id`, `type`, `version`, `source`, `time`, `correlation_id` and a data classification label; `VERIFY:` whether to adopt the CloudEvents specification as the envelope."
  - id: "API-026"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Schema evolution MUST be backward compatible for the supported consumer window; breaking changes use a new event type or version with dual publishing during migration."
  - id: "API-027"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Consumers MUST be idempotent and MUST dead-letter messages that fail schema validation (see doc 18). Event payloads MUST NOT contain personal data beyond what the data-classification matrix permits."
  - id: "API-028"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "APIs that return user-facing text MUST honour `Accept-Language` (`en`, `fr`, `fr-CA`, `en-CA`), parse quality values, fall back to `en` (`ASSUMPTION:` default pending F6), and return `Content-Language` for the language actually used. `VERIFY:` against RFC 9110."
  - id: "API-029"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Machine-readable fields (`code`, `type`, enums, identifiers, dates, amounts) MUST be locale-independent. Only human text (`title`, `detail`, display labels) is localized; RFC 9457 allows `title` to vary only by localization."
  - id: "API-030"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Both EN and FR strings MUST exist for every user-facing error `title` and `detail` and be covered by a test; message catalogues live outside code and follow doc 22."
  - id: "API-031"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "APIs SHOULD return structured data and let clients format dates, numbers and currency; where formatted values are returned, they MUST follow the requested locale. Generated LLM text MUST carry its language in the response metadata."
  - id: "API-032"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Locale MUST be an explicit input to any LLM-backed endpoint (not inferred silently from message text), and MUST be recorded in telemetry as a bounded attribute."
  - id: "API-033"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "A tool exposed to an agent is an API: it MUST have a versioned input schema, output schema and error schema, validated at runtime, and subject to API-002 to API-005 and API-020 to API-023. The manifest format, lifecycle, approval and eval requirements are owned by [25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md)."
  - id: "API-034"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "Tool errors MUST reuse the problem-details shape (API-009) so agents and logs handle failures uniformly, without leaking data into the model context."
  - id: "API-035"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "17-api-and-contracts.md"
    owner: "Architecture lead (API standards)"
    retired: false
    text: "LLM-facing structured output schemas MUST be pydantic models validated on every response, with a typed failure on invalid output (retry policy owned by doc 18)."
  - id: "REL-001"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff"
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Every outbound network call (HTTP, DB, queue, LLM) MUST set an explicit timeout. Library defaults MUST NOT be relied on. A custom lint or a wrapper client enforces this."
  - id: "REL-002"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Inbound requests MUST have a total deadline; downstream calls MUST use the remaining budget, never a fresh full timeout."
  - id: "REL-003"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Retries MUST use exponential backoff with jitter, a bounded attempt count and a maximum delay."
  - id: "REL-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Only idempotent operations, or operations carrying an idempotency key, MAY be retried. Non-idempotent writes MUST NOT be retried blindly."
  - id: "REL-005"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Retry only transient errors (timeouts, connection resets, 429, 502, 503, 504). Never retry 400, 401, 403, 404, 409 or schema validation failures."
  - id: "REL-006"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Retries MUST NOT be layered: exactly one layer (the client wrapper) retries. Retry budgets MUST be bounded so retries cannot exceed a small fraction (`ASSUMPTION:` 10%) of base traffic."
  - id: "REL-007"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Each remote dependency SHOULD sit behind a circuit breaker and a concurrency limit (bulkhead). Breaker state changes MUST emit a metric and a log event."
  - id: "REL-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Where the server sends `Retry-After` on 429 or 503, the client MUST honour it (capped by the request deadline). `VERIFY:` that the chosen provider SDK does not already retry, to avoid double retry."
  - id: "REL-009"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "LLM calls MUST go through the single wrapper client in `adapters/llm/`; the wrapper owns timeout, retry, 429 handling, breaker and telemetry."
  - id: "REL-010"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "On 429 or quota errors the wrapper MUST back off, then fail fast with a typed error; it MUST NOT spin retries or silently switch to an unapproved model or provider."
  - id: "REL-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Each LLM-dependent feature MUST define a degradation mode in its design: (a) deterministic fallback, (b) queue for later, (c) human handoff, or (d) clear unavailable message in EN and FR. The choice is recorded in the service README."
  - id: "REL-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "A fallback model MUST be a pre-approved deployment (placeholder `<fallback-deployment>`) per [15-llm-and-model-governance.md](./15-llm-and-model-governance.md) with evals passed; fallbacks MUST NOT be improvised at runtime."
  - id: "REL-013"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Prefer deterministic code paths for anything that must keep working when the LLM is down (see [04-engineering-principles.md](./04-engineering-principles.md))."
  - id: "REL-014"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Token and request quotas MUST be monitored; an alert MUST fire before saturation, not after the first 429."
  - id: "REL-015"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Message and job handlers MUST be idempotent: processing the same message twice yields the same final state. A test MUST deliver each handler's message twice."
  - id: "REL-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Multi-step or long-running workflows MUST persist step state (queue, durable workflow engine or database) so a crash resumes rather than restarts. `ASSUMPTION:` engine choice is an ADR (see [05-decision-playbook.md](./05-decision-playbook.md))."
  - id: "REL-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Queues MUST have a dead-letter path, a maximum delivery count and an alert on dead-letter depth. Poison messages MUST NOT block the queue."
  - id: "REL-018"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Side effects with external parties (emails, payments, case updates) SHOULD use an outbox or an idempotency key so retries never duplicate them."
  - id: "REL-019"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Services MUST expose separate liveness and readiness endpoints. Liveness MUST NOT check dependencies; readiness MUST reflect ability to serve. `VERIFY:` probe settings for the chosen Azure host."
  - id: "REL-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Every user-facing or agent-facing service MUST define SLIs (availability, latency percentile, and for AI features, task success rate from evals) and a numeric SLO with an owner."
  - id: "REL-021"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Alert on SLO burn rate (multi-window) rather than raw thresholds; every alert MUST link to a runbook."
  - id: "REL-022"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Tier services (`ASSUMPTION:` tier 1 customer-impacting/regulated decision, tier 2 internal, tier 3 batch) and set SLO, on-call and recovery objectives by tier."
  - id: "REL-023"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Rate limiting MUST protect every public and internal API (per client identity); limit responses MUST use 429 with a problem body per [17-api-and-contracts.md](./17-api-and-contracts.md)."
  - id: "REL-024"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Every agent and every LLM-backed feature MUST have a kill switch (feature flag or config) that disables it without a deploy, is tested, and degrades per REL-011. The switch's location and owner are recorded in the agent manifest ([25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md))."
  - id: "REL-025"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "The kill switch MUST be operable by on-call without code changes and MUST be exercised at least once per quarter (`ASSUMPTION:` cadence)."
  - id: "REL-026"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Cost anomaly alerts MUST exist per LLM-using service (spend per day and tokens per request against a baseline) with a named responder; budgets are owned by doc 15."
  - id: "REL-027"
    level: "SHOULD"
    enforcement: "runtime"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Agents SHOULD have hard per-run limits (steps, tool calls, tokens, wall clock) enforced in code, so a loop cannot run away."
  - id: "REL-028"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Each service MUST have a runbook in `docs/runbooks/` using the template below, reviewed at least every 6 months (`ASSUMPTION:`) and after each incident."
  - id: "REL-029"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Incidents MUST be classified by severity; AI-specific incidents (harmful output, data exposure through a model, runaway agent) MUST be escalated to the AI governance team and security per the incident process in [12-governance-and-compliance.md](./12-governance-and-compliance.md). `ASSUMPTION:` F1 policy names pending."
  - id: "REL-030"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Sev 1 and Sev 2 incidents MUST have a blameless postmortem within 5 business days (`ASSUMPTION:`) with owned, dated actions tracked to closure."
  - id: "REL-031"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Regulatory incident reporting obligations (for example technology or cyber incident reporting to OSFI) MUST be confirmed with Compliance and encoded in the runbook. `VERIFY:` timelines against primary OSFI text; none are asserted here."
  - id: "REL-032"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "18-reliability-and-operations.md"
    owner: "Platform Engineering lead (SRE)"
    retired: false
    text: "Run a game day or failure-injection test (provider 429s, provider down, dependency slow) for each tier 1 AI service before go-live and yearly."
  - id: "RAG-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A design MUST start at the lowest sufficient step of the retrieval ladder and justify any move to vector or hybrid with eval results in the ADR."
  - id: "RAG-002"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Structured sources (databases, forms, policy admin data) SHOULD be queried through typed tools or SQL with schema-scoped access, not embedded into a vector index."
  - id: "RAG-003"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Retrieval MUST be a separate, testable component (`ai/retrieval/`) with its own eval suite before it is composed into an agent."
  - id: "RAG-004"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Chunk along document structure (sections, clauses, table rows) rather than fixed character windows; each chunk SHOULD carry a title path, source ID, version and language as metadata."
  - id: "RAG-005"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Chunk size, overlap and embedding deployment MUST be recorded in config and changed only via MR; any change MUST trigger a full re-index and a retrieval eval re-run."
  - id: "RAG-006"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "The embedding model deployment MUST be an approved Foundry deployment referenced by a placeholder-style config name (for example `<embedding-deployment>`), version-pinned per [15-llm-and-model-governance.md](./15-llm-and-model-governance.md); mixing embeddings from different models in one index MUST NOT occur."
  - id: "RAG-007"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Bilingual corpora MUST store language per chunk and be evaluated with EN queries over FR documents and the reverse; the embedding choice MUST be validated for both languages."
  - id: "RAG-008"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Each index MUST have a documented freshness SLO (maximum age of source change to searchable) and a monitor that alerts on breach."
  - id: "RAG-009"
    level: "SHOULD"
    enforcement: "runtime"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Indexing SHOULD be incremental with change detection; a full rebuild SHOULD use a new index plus alias swap so it can be rolled back."
  - id: "RAG-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Superseded document versions MUST be removed or flagged inactive so retrieval does not return stale policy wording."
  - id: "RAG-011"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Document-level access control MUST be enforced at retrieval time by filtering on the caller's identity, never by asking the model to withhold content; unauthorized chunks MUST NOT enter the prompt."
  - id: "RAG-012"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "The caller identity used in the filter MUST come from the verified end-user token or session, never from model output or request text."
  - id: "RAG-013"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A cross-user leakage eval MUST run on every retrieval change: queries as user A MUST return zero chunks only user B may see (threshold 0 leaks)."
  - id: "RAG-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Permission metadata in the index MUST be refreshed when source permissions change; the maximum staleness MUST be stated and approved (ASSUMPTION: no more than the freshness SLO)."
  - id: "RAG-015"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Index write roles MUST be separated from query roles, and the query identity MUST NOT hold a role that bypasses document filters."
  - id: "RAG-016"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Indexes SHOULD be partitioned by data classification so restricted content is never co-mingled with lower classes ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "RAG-017"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Every generated answer that uses retrieved content MUST include citations that resolve to chunk IDs and source documents the caller is authorized to see."
  - id: "RAG-018"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A citation checker MUST verify that each cited chunk was actually retrieved in that request and supports the claim; uncitable claims MUST be omitted or marked as not grounded."
  - id: "RAG-019"
    level: "SHOULD"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "When retrieval returns nothing above the relevance threshold, the system SHOULD answer \"not found\" and escalate, rather than answer from model memory."
  - id: "RAG-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Retrieved text MUST be treated as untrusted input (indirect prompt injection); it MUST be delimited from instructions and MUST NOT be able to trigger tool calls without the normal approval gates ([02-security.md](./02-security.md))."
  - id: "RAG-021"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Ingestion MUST accept documents only from allow-listed sources, record provenance (source, uploader, hash, time) per chunk, and quarantine documents failing content checks."
  - id: "RAG-022"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "An injection-in-document suite (planted instructions in indexed text) MUST run per doc 14 and pass before release."
  - id: "RAG-023"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Embedding inversion and cross-tenant leakage risks (OWASP LLM08:2025, Vector and Embedding Weaknesses) SHOULD be reviewed in threat modeling for each index; `VERIFY:` whether a 2026 OWASP LLM list edition has renumbered this entry before citing \"LLM08\" externally."
  - id: "RAG-024"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Content MUST be classified before indexing; restricted data MUST NOT be indexed without an approved PIA per doc 13, and PII SHOULD be removed or tokenized before embedding."
  - id: "RAG-025"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "A deletion request or retention expiry for a source document MUST propagate to chunks, embeddings, caches, eval datasets and backups per the schedule in [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md); a test MUST confirm the deleted ID is no longer retrievable."
  - id: "RAG-026"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Query text and retrieved chunks written to logs or traces MUST follow the redaction rules in [10-logging-observability.md](./10-logging-observability.md); retrieved content MUST NOT be logged by default."
  - id: "RAG-027"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Each retriever MUST have a golden query set with labeled relevant chunks, measuring recall at k, MRR or nDCG, citation correctness and leakage rate, gated through `evals/thresholds.yaml` per doc 14."
  - id: "RAG-028"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "19-rag-and-retrieval.md"
    owner: "AI Engineering lead"
    retired: false
    text: "Retrieval and generation SHOULD be evaluated separately so a failure can be attributed to one stage."
  - id: "DEP-001"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Python packages MUST be installed only from the approved registry or internal mirror configured in the project (`pyproject.toml` / uv index settings). Ad hoc `--index-url`, `--extra-index-url`, direct URLs and VCS dependencies MUST NOT be used without a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md)). `VERIFY:` uv index configuration keys."
  - id: "DEP-002"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Where more than one index is configured, each package MUST be pinned to a single named index so a public package cannot shadow an internal name (dependency confusion)."
  - id: "DEP-003"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Base images and tool images MUST come from the approved container registry and be pinned by digest; see CIC-007 in [16-cicd-and-deployment.md](./16-cicd-and-deployment.md)."
  - id: "DEP-004"
    level: "MUST"
    enforcement: "ci"
    tool: "lockfile check"
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Every service MUST commit a lockfile (`uv.lock`) generated from `pyproject.toml`; CI MUST fail if the lockfile is stale (`uv lock --check`, documented as not updating the lockfile)."
  - id: "DEP-005"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "CI and container builds MUST install from the lockfile without re-resolving. `VERIFY:` the exact `uv sync` flag (`--locked` / `--frozen`); the uv page read shows them with `uv run` and defines `--frozen` as skipping the up-to-date check."
  - id: "DEP-006"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "The lockfile SHOULD include artifact hashes; installs SHOULD verify them. `VERIFY:` uv hash behaviour; with pip-tools use `--generate-hashes`."
  - id: "DEP-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Direct dependencies in `pyproject.toml` MUST have a lower bound and a justified upper bound policy (compatible-release for stable libraries, exact for fast-moving or pre-1.0 libraries)."
  - id: "DEP-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "`opentelemetry-*` packages MUST be upgraded as one set (see [10-logging-observability.md](./10-logging-observability.md)); Foundry and vendor AI SDKs MUST be pinned exactly (see [23-azure-foundry-standards.md](./23-azure-foundry-standards.md))."
  - id: "DEP-009"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff"
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Dev, test and docs dependencies MUST live in separate dependency groups and MUST NOT be installed in production images."
  - id: "DEP-010"
    level: "SHOULD"
    enforcement: "ci"
    tool: "renovate"
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "A bot SHOULD open grouped, scheduled update merge requests (`ASSUMPTION:` weekly for minor and patch; major versions individually). Bot merge requests MUST pass the same pipeline and review as human ones."
  - id: "DEP-011"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Known-vulnerable dependencies MUST be remediated within the SLA by severity (`ASSUMPTION:` critical 7 days, high 30 days, medium 90 days) or carry a waiver with compensating controls."
  - id: "DEP-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Bot or agent merge requests MUST NOT auto-merge major upgrades, new transitive licences in a denied category, or any change to a lockfile entry for an AI or security library without human review."
  - id: "DEP-013"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Dependencies with no release in 24 months, a single maintainer, or an archived repository SHOULD be flagged for replacement in the next review."
  - id: "DEP-014"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Python minor version upgrades follow the policy in doc 00; dependencies that block the supported minor MUST be replaced or upgraded."
  - id: "DEP-015"
    level: "MUST"
    enforcement: "ci"
    tool: "licence scanner"
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "CI MUST generate a licence report for direct and transitive dependencies and fail on denied or unknown licences. `VERIFY:` tool (for example a CycloneDX-based or licence-checker tool) and GitLab licence features by tier."
  - id: "DEP-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "A new direct dependency in the review category MUST have recorded Legal approval before merge."
  - id: "DEP-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "The licence allow/deny list MUST live in one machine-readable file in the platform repository, owned by Legal, and be consumed by CI. Services MUST NOT keep their own copies."
  - id: "DEP-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Code, data and model assets copied from outside the org MUST have their licence recorded; AI-generated code MUST NOT copy verbatim from licensed sources (see [01-codebase-practices.md](./01-codebase-practices.md))."
  - id: "DEP-019"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "CI MUST fail when a new dependency is not on the approved registry, or when the package name is not already in a platform-maintained allowlist and has not passed the new-package check (DEP-020)."
  - id: "DEP-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "A new-package check MUST confirm: the exact name exists on the approved index, is not one edit away from a popular package, has a real source repository matching the publisher, has release history, and is not newly created. Record the result in the MR description."
  - id: "DEP-021"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "AI agents MUST NOT run installs of packages they have not verified exist; they MUST propose the addition and run the check. Packages suggested by a model MUST be treated as untrusted until verified."
  - id: "DEP-022"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "CI SHOULD run `pip-audit` against the lockfile or project (`--locked` audits lock files; `--strict` fails on collection errors). pip-audit does not defend against malicious packages, so it complements DEP-020 and does not replace it."
  - id: "DEP-023"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Install steps SHOULD disable running arbitrary build scripts from unknown sdists where supported (prefer wheels). `VERIFY:` the uv/pip option names."
  - id: "DEP-024"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Each release MUST produce a CycloneDX SBOM (for example `uv export` with a CycloneDX format, or `pip-audit -f cyclonedx-json`; `VERIFY:` current flags) covering application and image layers, attached to the release."
  - id: "DEP-025"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "SBOMs MUST be retained per doc 12 and be queryable by package name so a new advisory can be mapped to affected services within one business day (`ASSUMPTION:`)."
  - id: "DEP-026"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Shared internal code SHOULD be published as versioned packages (semver, changelog, owner) to the internal index, not copied between repositories or consumed from branches."
  - id: "DEP-027"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Internal packages MUST pass the same gates as services (tests, type check, scans, SBOM) and MUST NOT contain secrets, customer data or environment-specific values."
  - id: "DEP-028"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "A new vendor SDK or client library for an external service MUST be approved by Security and, where it touches data or models, by the owners of docs 12 and 15 before adoption. Preview or beta SDK features in production require a waiver."
  - id: "DEP-029"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "The approved-dependency exceptions list MUST name an owner and expiry for each entry; expired entries fail CI."
  - id: "DEP-030"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "20-dependencies-and-licensing.md"
    owner: "Platform Engineering lead with Security and Legal"
    retired: false
    text: "Prefer the standard library or an existing approved dependency over adding a new one for trivial functionality."
  - id: "WVR-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "A `MUST` rule MUST NOT be bypassed except under an approved, active waiver for that rule ID and scope."
  - id: "WVR-002"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "A departure from a `SHOULD` rule SHOULD be explained in the MR description with the rule ID and reason; no waiver is required."
  - id: "WVR-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "A waiver request MUST use the template and name the rule IDs, exact scope, risk, compensating controls, exit plan and an expiry date."
  - id: "WVR-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "The requester MUST be a human employee. An AI agent MUST NOT request, approve, extend, edit or self-grant a waiver, and MUST NOT mark a waiver as approved."
  - id: "WVR-005"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "The approver set MUST match the tier table and MUST NOT include the requester; approvals MUST be recorded with date and identity."
  - id: "WVR-006"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "A waiver MUST include at least one compensating control that is testable or monitored, and the request MUST state how it is verified."
  - id: "WVR-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "A waiver MUST NOT be granted for a rule that is a legal or regulatory obligation unless Compliance/Legal approves in writing; the tier table alone is insufficient. VERIFY: with Compliance which rules fall in this class once the mapping in [12-governance-and-compliance.md](./12-governance-and-compliance.md) is final."
  - id: "WVR-008"
    level: "MUST"
    enforcement: "ci"
    tool: "waiver-check"
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Every waiver MUST have an expiry date not later than the tier maximum; open-ended waivers are invalid."
  - id: "WVR-009"
    level: "MUST"
    enforcement: "ci"
    tool: "waiver-check"
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "The pipeline MUST fail the build for a waived rule once its waiver has expired, and MUST fail when a suppression references a waiver ID that does not exist or is not active."
  - id: "WVR-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Renewal MUST be a new approval at the tier required then, with evidence of progress on the exit plan; a waiver MUST NOT be renewed more than twice without AI Governance and Engineering standards review."
  - id: "WVR-011"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Owners SHOULD receive an automatic reminder at least 14 days before expiry."
  - id: "WVR-012"
    level: "MUST"
    enforcement: "ci"
    tool: "waiver-check"
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Every active waiver MUST appear in the waiver registry (a Git-tracked file or issue board, `ASSUMPTION:` location TBD) with its status, scope and expiry."
  - id: "WVR-013"
    level: "MUST"
    enforcement: "ci"
    tool: "waiver-check"
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Any in-code or in-config suppression of a `MUST` rule (for example `# noqa`, `# type: ignore`, `# nosec`, scanner ignore entries, `ignore_errors`) MUST carry a waiver ID in the same line or entry; unreferenced suppressions MUST fail the check."
  - id: "WVR-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "The MR that relies on a waiver MUST reference the waiver ID and the rule ID(s)."
  - id: "WVR-015"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "The waiver registry MUST be reviewed monthly by the Engineering standards owner and reported to AI Governance each quarter (`ASSUMPTION:` cadence), including count, age and renewals per rule."
  - id: "WVR-016"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Rules waived frequently SHOULD be reviewed as candidates for rule change, since they signal an unrealistic or unclear rule."
  - id: "WVR-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Use of a preview feature, a non-approved LLM provider or model, or a non-default region for an AI workload MUST have a waiver and the third-party approval described in [12-governance-and-compliance.md](./12-governance-and-compliance.md)."
  - id: "WVR-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "Emergency exceptions (production incident) MAY be approved verbally by the incident commander and one specialist approver, but MUST be written up as a waiver within two business days with a maximum duration of 14 days."
  - id: "WVR-019"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "21-exceptions-and-waivers.md"
    owner: "Head of Engineering Standards (with AI Governance)"
    retired: false
    text: "When a waiver expires or closes, the owner MUST remove the suppression or exception in the same or next release and record closure in the registry."
  - id: "LOC-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Every user-facing string and AI-generated output for Quebec-facing or bilingual products MUST be available in French and English with equivalent content, quality and availability; confirm with Legal (F6)."
  - id: "LOC-002"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "The response language MUST be decided by an explicit, testable rule (user preference, then `Accept-Language`, then default); the model MUST NOT guess language from a single word."
  - id: "LOC-003"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "AI output MUST be in the requested language only, with no unrequested mixing, except for proper nouns, product names and legally defined terms."
  - id: "LOC-004"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Regulated or legally significant text (policy wording, denials, disclosures) SHOULD come from approved bilingual templates, not free-form generation; AI MAY draft, a qualified human MUST approve before it is sent (ASSUMPTION; confirm with Legal)."
  - id: "LOC-005"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "A glossary of approved EN/FR insurance terms MUST be kept under version control and used in prompts and checks; ASSUMPTION: Canadian French (OQLF terminology, Grand dictionnaire terminologique) is the target variety, not European French. `VERIFY:` the terminology resource with Legal or the language team."
  - id: "LOC-006"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Language-switching and refusal messages (errors, guardrail blocks, escalations) MUST exist in both languages."
  - id: "LOC-007"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Locale MUST be a BCP 47 tag (`en-CA`, `fr-CA`) carried as an explicit request or user attribute; code MUST NOT infer locale from server settings."
  - id: "LOC-008"
    level: "MUST"
    enforcement: "lint"
    tool: "ruff"
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Dates, times, numbers and currency MUST be formatted through a locale library (ASSUMPTION: Babel; `VERIFY:` approval in [20-dependencies-and-licensing.md](./20-dependencies-and-licensing.md)), never by string concatenation. Examples: `fr-CA` uses a space for thousands and a comma for decimals; format stored data as ISO 8601 and currency as ISO 4217 amounts."
  - id: "LOC-009"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Stored data and API payloads MUST stay locale-neutral (ISO dates, numeric amounts, codes); localization MUST happen at the presentation boundary."
  - id: "LOC-010"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Text handling MUST be Unicode-safe: UTF-8 end to end, NFC normalization for comparison, accented characters preserved in search, sorting (locale collation) and PII matching."
  - id: "LOC-011"
    level: "SHOULD"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Strings SHOULD live in message catalogs (for example gettext `.po` files), with plural and gender handled by the catalog; code MUST NOT embed user-facing text in logic. UI layouts SHOULD tolerate FR text, which is commonly longer than EN."
  - id: "LOC-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Names, addresses and postal codes MUST NOT be restricted to ASCII; forms MUST accept accented and hyphenated characters."
  - id: "LOC-013"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Any feature producing translated or bilingual output MUST have a bilingual eval slice in its golden dataset, with EN to FR, FR to EN and native-FR prompts, gated through `evals/thresholds.yaml` per doc 14."
  - id: "LOC-014"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Translation evals MUST check deterministically: glossary term compliance, preserved numbers, dates, amounts, names and placeholders, no untranslated segments, and correct language detection."
  - id: "LOC-015"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Quality judged by an LLM SHOULD use a rubric (adequacy, fluency, terminology, register) calibrated against labels from a qualified bilingual reviewer; the judge MUST NOT be the sole evidence for legally significant text."
  - id: "LOC-016"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Parity MUST be measured: the FR quality score MUST NOT fall below the EN score by more than a stated margin (ASSUMPTION: 3 percentage points); FR failures block release even if EN passes."
  - id: "LOC-017"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "A bilingual human reviewer SHOULD sample production output per doc 14 online-monitoring rules for both languages."
  - id: "LOC-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Translation and eval data MUST be synthetic or de-identified ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md)); text sent to a translation model is subject to the same data-class rules as any prompt."
  - id: "LOC-019"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Retrieval over bilingual content MUST follow the language rules in [19-rag-and-retrieval.md](./19-rag-and-retrieval.md) and cite sources in the response language where a translation exists."
  - id: "LOC-020"
    level: "MUST"
    enforcement: "ci"
    tool: "automated a11y scan"
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "ASSUMPTION: The target is **WCAG 2.2 Level AA** for all user-facing web UIs (F6; confirm with Legal and Product). Automated accessibility scanning (for example axe-core via a browser test; `VERIFY:` tool approval) MUST run in CI and block on violations."
  - id: "LOC-021"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Automated scans catch only part of the issues; each user-facing release MUST also pass a manual check: keyboard-only operation, visible focus, screen reader pass on the main flows, 200 percent zoom and reflow."
  - id: "LOC-022"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "WCAG 2.2 additions at Level AA MUST be covered: focus not obscured (2.4.11), dragging alternatives (2.5.7), minimum target size (2.5.8), accessible authentication (3.3.8). Verified against w3.org/TR/WCAG22."
  - id: "LOC-023"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "The page language MUST be set (`lang=\"en-CA\"` or `lang=\"fr-CA\"`) and changes of language within content MUST be marked up, so screen readers pronounce correctly."
  - id: "LOC-024"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "AI chat and generative UIs MUST: announce new messages to assistive technology (live regions), keep focus predictable on streamed output, not disappear or time out without warning, offer a text alternative for any generated image or chart, and provide an accessible path to a human."
  - id: "LOC-025"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Generated content MUST use plain language and structure (headings, lists) and MUST NOT rely on color, position or sound alone to convey meaning."
  - id: "LOC-026"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Accessibility conformance evidence (scan reports, manual test notes, known issues) SHOULD be stored with the release record; known failures MUST have an owner and date."
  - id: "LOC-027"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Voice interfaces and generated documents (PDF, email) SHOULD meet equivalent accessibility requirements (tagged PDF, text alternatives); `VERIFY:` applicable standard with Legal."
  - id: "LOC-028"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "22-localization-and-accessibility.md"
    owner: "Product Engineering lead"
    retired: false
    text: "Product and Legal MUST confirm which accessibility laws and standards apply to each product before first release and record the answer in an ADR. `VERIFY:` candidates for Legal to assess: the federal Accessible Canada Act and its regulations, provincial laws (for example Ontario AODA, Quebec requirements), and the Canadian standard CAN/ASC EN 301 549 (Accessibility requirements for ICT products and services). None of these is confirmed applicable here."
  - id: "FDY-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "LLM calls MUST go through the Foundry project endpoint (`https://<resource>.services.ai.azure.com/api/projects/<project>`) using the `azure-ai-projects` Python SDK. Any other LLM provider or SDK path needs a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md)) and vendor approval ([12-governance-and-compliance.md](./12-governance-and-compliance.md))."
  - id: "FDY-002"
    level: "MUST"
    enforcement: "ci"
    tool: "lockfile check"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`azure-ai-projects` MUST be pinned to an exact version in the lockfile. Learn requires `>=2.3.0` (a floor, not a recommendation); PyPI listed 2.11.0 released 2026-11-13 (VERIFY: re-check at each bump). 2.x is incompatible with 1.x. VERIFY: whether the separate `azure-ai-agents` Python package is fully unnecessary; the 2.x Python quickstart installs only `azure-ai-projects`."
  - id: "FDY-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Preview features MUST NOT be used in production without a waiver. In the SDK, preview surfaces are reached with `allow_preview=True` or `.beta` sub-clients; REST preview opt-ins use a `Foundry-Features` header. Code review MUST reject these unless a waiver id is cited."
  - id: "FDY-004"
    level: "MUST"
    enforcement: "ci"
    tool: "gitleaks"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Authentication MUST use Microsoft Entra (managed identity or workload identity in deployed environments, `az login` locally); API keys MUST NOT be used or stored ([06-secrets-and-env.md](./06-secrets-and-env.md)). Deployed code SHOULD use an explicit credential rather than the default credential chain."
  - id: "FDY-005"
    level: "MUST"
    enforcement: "lint"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Deployment and agent names MUST come from configuration (placeholders such as `<chat-deployment>` in docs and examples), never hard-coded model names in code."
  - id: "FDY-006"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "All model calls SHOULD go through one adapter module that applies timeouts, retries, redaction, telemetry and output validation ([09-structure-and-format.md](./09-structure-and-format.md))."
  - id: "FDY-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Clients MUST set explicit timeouts below the documented ceilings (streaming non-reasoning calls up to 60 seconds; reasoning and non-streaming up to 29 minutes) and MUST retry HTTP 429 with exponential backoff honoring `Retry-After` ([18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "FDY-008"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Agent type SHOULD follow [05-decision-playbook.md](./05-decision-playbook.md): a prompt agent when no custom runtime code is needed; a hosted agent when the agent calls custom code or needs custom orchestration; the Responses API directly (ephemeral agent) when the definition ships with the application. Voice-based prompt agents are for real-time voice only."
  - id: "FDY-009"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Production agent definitions MUST live in Git and be published by CI (`create_version`), never authored by hand in the portal. Each published version MUST map to a manifest ([25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md))."
  - id: "FDY-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Each agent MUST use its own Entra agent identity. New agents get their own blueprint and identity with no permissions; grants MUST be explicit, least privilege and scoped to the narrowest resource. The legacy shared project identity MUST NOT be used for new agents."
  - id: "FDY-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "On-behalf-of-user access for agent tools is documented as preview; using it in production MUST have a waiver and a compensating control (for example the tool re-checks the user's entitlement)."
  - id: "FDY-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Built-in Foundry roles (Foundry User, Foundry Owner, Foundry Account Owner, Foundry Project Manager; formerly Azure AI User and so on, role ids unchanged) MUST be assigned at the narrowest scope; humans MUST NOT hold Owner roles on production projects day to day."
  - id: "FDY-013"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tools SHOULD be provided through a Foundry Toolbox when the platform decision (F12) is made, with toolbox versions promoted to default only through a merge request. Toolbox Skills are preview and fall under FDY-003."
  - id: "FDY-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Orchestration frameworks are not the default. If one is adopted (for example Microsoft Agent Framework, LangGraph), versions MUST be pinned and the choice recorded in an ADR. VERIFY: Agent Framework class renames reported for 2026 (`ChatAgent` to `Agent`, `@ai_function` to `@tool`) before writing code from memory."
  - id: "FDY-015"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Agent-to-agent endpoints MUST use A2A v1.0 (generally available); A2A v0.3 is preview and falls under FDY-003."
  - id: "FDY-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Regulated workloads MUST use private networking: prompt agents with private networking, hosted agents with bring-your-own virtual network, and public network access to the Foundry resource disabled. VERIFY: exact resource settings and Terraform attributes before writing IaC."
  - id: "FDY-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The networking decision for a hosted agent MUST be made at creation time. VERIFY: a third-party guide says network injection cannot be added afterwards; Learn pages read did not confirm this."
  - id: "FDY-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Hosted agents MUST have network egress controls configured with an allow-list. Egress controls are generally available except Transform rules, which are preview; Azure Policy governance for egress guardrails applies to hosted agents only."
  - id: "FDY-019"
    level: "MUST"
    enforcement: "ci"
    tool: "terraform plan check"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Every agent MUST have an explicit, named guardrail assigned; because agent guardrails are preview, FDY-021 and FDY-003 apply (waiver plus compensating controls). An agent's guardrail fully overrides its model's guardrail; an agent with none inherits the model deployment's guardrail, which is `Microsoft.DefaultV2` by default. VERIFY: Terraform and SDK attribute for assigning a guardrail to an agent."
  - id: "FDY-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Guardrails MUST be treated as defense in depth, not the sole control. Input validation, output schema validation, tool allow-lists and human approval remain required ([02-security.md](./02-security.md))."
  - id: "FDY-021"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Agent guardrails are documented as preview, including the tool-call and tool-response intervention points. Their use is a preview feature under FDY-003: it MUST be recorded in the agent manifest with compensating controls AND a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md)). Spotlighting and groundedness controls do not apply to agents."
  - id: "FDY-022"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Blocking levels SHOULD be chosen by risk tier. Content-risk output filtering MUST NOT be turned off; that option exists only for customers approved by Microsoft and requires governance approval."
  - id: "FDY-023"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Groundedness detection (preview) is documented as retiring on 2027-04-30, so grounding checks SHOULD be owned by evals ([14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md)) and not by this feature."
  - id: "FDY-024"
    level: "MUST"
    enforcement: "ci"
    tool: "azure policy"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "For workloads that process personal or restricted data, deployments MUST use the `Standard` or `ProvisionedManaged` deployment types only. `GlobalStandard`, `GlobalProvisionedManaged`, `GlobalBatch`, `DataZone*` and `DeveloperTier` MUST be denied by Azure Policy on `sku.name` for those subscriptions. Learn states Global types may process in any Azure region; Data Zones exist only for US, EU and APAC, so there is no Canadian data zone; `DeveloperTier` has no residency guarantee."
  - id: "FDY-025"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The PIA MUST address processing location and foreign-access risk for the chosen deployment type ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md)). ASSUMPTION: Canada Central is the primary region; VERIFY: which approved models are offered as `Standard` in a Canadian region, since geography-based types launch last and have no guaranteed availability date."
  - id: "FDY-026"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Batch processing exists only as `GlobalBatch` and `DataZoneBatch`, so batch pipelines MUST NOT send personal information to it; use synchronous `Standard` calls or non-personal data ([26-ai-use-case-catalog.md](./26-ai-use-case-catalog.md) case 24)."
  - id: "FDY-027"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Instant model access (documented as preview, calls a model without a deployment) MUST NOT be used in production because it bypasses deployment, version and policy controls."
  - id: "FDY-028"
    level: "MUST"
    enforcement: "ci"
    tool: "terraform plan check"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Deployments MUST be created by Terraform, one per environment and purpose, with the model version pinned and `versionUpgradeOption` set explicitly. `OnceNewDefaultVersionAvailable` MUST NOT be used in production. Workloads in the medium and high risk tiers MUST use `NoAutoUpgrade` and migrate on schedule; `OnceCurrentVersionExpired` is allowed only for low risk with passing evals. VERIFY: Terraform attribute name for the upgrade option."
  - id: "FDY-029"
    level: "MUST"
    enforcement: "ci"
    tool: "scheduled job"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "A scheduled job MUST read each deployed model's `lifecycleStatus` and `deprecation` dates from the Models API and alert the owner at 120 days before retirement. Migration MUST start at least 90 days before retirement because dates are not extendable, `NoAutoUpgrade` deployments stop at retirement (inference returns `410 Gone`), and provisioned deployments are never auto-upgraded. Process is owned by [15-llm-and-model-governance.md](./15-llm-and-model-governance.md)."
  - id: "FDY-030"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Quota MUST NOT be used as the cost control. Budgets and anomaly alerts are required ([15-llm-and-model-governance.md](./15-llm-and-model-governance.md), [18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "FDY-031"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Teams SHOULD check the quota scope per model in the Foundry portal (subscription-level pools for onboarded models; per-region otherwise) and request increases before launch. Subscription quota tiers can upgrade automatically; opting out is preview."
  - id: "FDY-032"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tracing MUST be enabled to the project's Application Insights resource. Tracing is documented as generally available for prompt, hosted and external agents; workflow agents are preview. GenAI semantic conventions are Development status, so attribute names MAY change ([10-logging-observability.md](./10-logging-observability.md))."
  - id: "FDY-033"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Prompt, response and tool-argument content in traces MUST be redacted per [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md); content that cannot be redacted MUST go to the restricted table with limited access. Avoid duplicate instrumentation of the same call. VERIFY: content-capture setting names for the Python SDK."
  - id: "FDY-034"
    level: "SHOULD"
    enforcement: "ci"
    tool: "make eval"
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "CI evals SHOULD run in the team harness; Foundry evaluations SHOULD be used for production monitoring on sampled traffic, with results retained as audit evidence ([14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md)). VERIFY: Foundry evaluations GA status."
  - id: "FDY-035"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Each service MUST list the Foundry preview features it uses in its ADR with the waiver id; the platform team MUST review the list at each SDK bump."
  - id: "FDY-036"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "23-azure-foundry-standards.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Models from non-OpenAI publishers in the Foundry catalog MUST NOT be used until the approved list in [15-llm-and-model-governance.md](./15-llm-and-model-governance.md) names them. ASSUMPTION: unresolved item F2."
  - id: "TST-001"
    level: "MUST"
    enforcement: "ci"
    tool: "make check"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every repo MUST provide `make test`, `make test-unit` and `make test-integration`, and `make check` MUST run the tests; CI MUST run the same targets."
  - id: "TST-002"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every change that alters behavior MUST include a test that fails without the change; only docs-only or config-only MRs may omit tests."
  - id: "TST-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Developers and AI agents MUST write the failing test first, run it, confirm it fails for the expected reason, then write the code; the MR description MUST record the failing run."
  - id: "TST-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Test files under `tests/unit/` MUST mirror the `src/<package>/` tree (`src/pkg/domain/services/pricing.py` is tested in `tests/unit/domain/services/test_pricing.py`)."
  - id: "TST-005"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Markers MUST be registered and unknown markers MUST fail the run (pytest `strict`, see the reference config)."
  - id: "TST-006"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Test names SHOULD state behavior, for example `test_quote_rejects_negative_premium`, not `test_quote_1`; each test SHOULD assert one behavior."
  - id: "TST-007"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "The unit suite SHOULD finish in under 5 minutes on CI. ASSUMPTION: threshold to be confirmed by the platform team."
  - id: "TST-008"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest-socket"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Unit tests MUST NOT use the network; the unit run MUST use `--disable-socket`, and only tests marked `enable_socket` and `integration` MAY open sockets."
  - id: "TST-009"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Code under test MUST receive time, randomness and identifiers through injected parameters or ports (a `Clock` Protocol, a seeded `random.Random`, an ID factory); tests MUST NOT call `sleep` to wait for time to pass."
  - id: "TST-010"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest-randomly"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tests MUST pass in random order; CI MUST run with `pytest-randomly` and print the seed so failures reproduce."
  - id: "TST-011"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Warnings MUST fail tests (`filterwarnings = [\"error\"]`); an ignored warning MUST name the exact warning and carry a comment with a ticket."
  - id: "TST-012"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest-timeout"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every test MUST run under a per-test timeout (reference config uses 30 seconds)."
  - id: "TST-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tests MUST NOT read real environment variables, home directories or the working directory for state; they MUST use `tmp_path` and `monkeypatch`."
  - id: "TST-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Integration tests MUST use real dependencies (containers or vendor emulators) for databases, queues and storage, and MUST NOT mock the adapter they claim to test."
  - id: "TST-015"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Where no faithful emulator exists (for example Key Vault), tests SHOULD put a fake behind the port and add a contract test that pins the adapter's assumptions. VERIFY: current Azure emulator coverage (for example Azurite for storage) before naming one in a service."
  - id: "TST-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Integration tests MUST create uniquely named resources, clean up after themselves and be safe to run in parallel."
  - id: "TST-017"
    level: "MUST"
    enforcement: "test"
    tool: "tests/contract"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every HTTP endpoint and event schema MUST have contract tests that validate real responses and payloads against the published spec; spec rules live in [17-api-and-contracts.md](./17-api-and-contracts.md)."
  - id: "TST-018"
    level: "MUST"
    enforcement: "test"
    tool: "tests/contract"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every AI tool MUST have a contract test that validates its inputs and outputs against its registry manifest schema ([25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md))."
  - id: "TST-019"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "End-to-end tests SHOULD cover only the few critical user journeys, run against a deployed non-production environment with synthetic data, and run after deploy, not inside `make check`."
  - id: "TST-020"
    level: "MUST"
    enforcement: "test"
    tool: "hypothesis"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Pure domain logic that computes money, dates, eligibility or rules MUST have Hypothesis property tests for its invariants (bounds, monotonicity, idempotence, round trips); other pure functions SHOULD."
  - id: "TST-021"
    level: "MUST"
    enforcement: "ci"
    tool: "mutmut"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tier A deterministic domain logic (`domain/rules`, `domain/services`) MUST be mutation tested with mutmut, and the mutation score MUST meet the floor in the tier table; the CI job MUST fail below the floor using the gate script in this doc, because mutmut has no built-in threshold."
  - id: "TST-022"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Surviving mutants MUST be killed by a new test or marked `# pragma: no mutate` with a one-line reason; blanket `do_not_mutate` patterns MUST NOT be used to raise the score."
  - id: "TST-023"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Mutation testing MUST NOT target adapters, prompt code or LLM-dependent code; those are covered by TST-029 to TST-034 and by evals."
  - id: "TST-024"
    level: "MUST"
    enforcement: "ci"
    tool: "hypothesis"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Property tests MUST run under a derandomized `gate` profile in CI, and every failure Hypothesis finds MUST be committed as an `@example` regression case."
  - id: "TST-025"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest-cov"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Coverage MUST be measured with `branch = true` and gated by `fail_under` per the service tier table; coverage.py reports one combined line-plus-branch total, so the floor applies to that total."
  - id: "TST-026"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Coverage floors MUST only ratchet upward; lowering a floor requires a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md))."
  - id: "TST-027"
    level: "SHOULD"
    enforcement: "ci"
    tool: "coverage"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tier A services SHOULD also gate `domain/` at a higher floor with `coverage report --include='src/*/domain/*' --fail-under=<n>`."
  - id: "TST-028"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tests MUST NOT game metrics: no assertion-free tests, no `# pragma: no cover` without a reason on the same line, no tests that only execute code."
  - id: "TST-029"
    level: "MUST"
    enforcement: "test"
    tool: "tests/unit"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Unit tests MUST use a fake model client that implements the same port as the real client; unit tests MUST NOT call a live model or any network."
  - id: "TST-030"
    level: "MUST"
    enforcement: "test"
    tool: "tests/unit"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every code path that consumes model output MUST parse it through schema validation, and tests MUST cover malformed JSON, missing fields, wrong types, empty output, refusal, truncation, timeout and quota (429) responses."
  - id: "TST-031"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Recorded-response replay MAY be used for integration-level tests; cassettes MUST be synthetic, committed, keyed by prompt text or hash, and re-recorded only deliberately in a reviewed MR. ASSUMPTION: no replay library is mandated; a small in-repo replay client is acceptable."
  - id: "TST-032"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Live-model tests MUST carry the `live_llm` marker, MUST be excluded from default runs, MUST run only in a scheduled job against a non-production deployment (`<chat-deployment>`), and MUST have a per-run call and token budget enforced by the test harness."
  - id: "TST-033"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tests MUST NOT assert exact free-text model output; they MUST assert schema validity, invariants and routing decisions. Output quality is measured by evals in [14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md)."
  - id: "TST-034"
    level: "MUST"
    enforcement: "test"
    tool: "tests/unit"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Prompt loading MUST be tested: a prompt file whose hash differs from its pinned hash MUST be rejected ([15-llm-and-model-governance.md](./15-llm-and-model-governance.md) owns the prompt rules)."
  - id: "TST-035"
    level: "MUST"
    enforcement: "test"
    tool: "tests/unit"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Agent tool-call loops MUST be tested with scripted fake replies, including a tool call outside the allow-list, an invalid argument, a tool error and a loop that exceeds its step limit."
  - id: "TST-036"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Test data MUST be synthetic; production extracts, real customer data and real-looking identifiers MUST NOT appear in tests, fixtures, cassettes or snapshots ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "TST-037"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Tests SHOULD build data with small factories or builders with explicit overrides, not large shared JSON fixtures; names, policy numbers and addresses SHOULD be obviously fake."
  - id: "TST-038"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Snapshot or golden files MUST be small, human-reviewed in the MR, and regenerated only by an explicit, named command, never automatically in CI."
  - id: "TST-039"
    level: "MUST"
    enforcement: "ci"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A test that fails and then passes on retry is a defect; gating jobs MUST NOT use automatic rerun plugins."
  - id: "TST-040"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A flaky test MUST be quarantined (marked with a reason and ticket) within one business day and fixed or deleted within 14 days. ASSUMPTION: the 14-day window; confirm with the Engineering Quality lead."
  - id: "TST-041"
    level: "MUST"
    enforcement: "ci"
    tool: "pytest"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "`skip` and `xfail` MUST include a reason and a ticket reference, and `xfail` MUST be strict so an unexpectedly passing test fails the run."
  - id: "TST-042"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "An agent MUST NOT delete, skip, `xfail`, weaken or loosen a test, widen a tolerance, replace a specific assertion with a looser one, or regenerate a golden file in order to make a failing test pass; it MUST fix the code, or stop and report that the test appears wrong."
  - id: "TST-043"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "An agent that believes a test is wrong MUST NOT edit it itself; it MUST say so in the MR description and request human approval of the test change."
  - id: "TST-044"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Agents MUST NOT mock the unit under test, assert only that a mock was called when behavior can be observed, or write a test that cannot fail; each new test SHOULD be shown to fail once against a deliberately broken implementation."
  - id: "TST-045"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "CI SHOULD flag any MR that reduces the number of collected tests or the coverage total, and a human reviewer MUST explain the reduction. ASSUMPTION: this is a custom job (`pytest --collect-only -q` compared with the target branch); the platform team owns it."
  - id: "TST-046"
    level: "MUST"
    enforcement: "test"
    tool: "tests/unit"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Every endpoint and tool that enforces authorization MUST have a negative test proving that an unauthorized or wrong-tenant caller is denied ([02-security.md](./02-security.md) owns the security rules)."
  - id: "TST-047"
    level: "SHOULD"
    enforcement: "ci"
    tool: null
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Critical endpoints SHOULD have a performance smoke test with a latency budget, run on a schedule, not in the MR pipeline ([18-reliability-and-operations.md](./18-reliability-and-operations.md) owns SLOs). VERIFY: choose a load tool with the platform team."
  - id: "TST-048"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "The MR pipeline MUST run the unit and integration jobs with `allow_failure: false`, and the merge MUST be blocked when either fails."
  - id: "TST-049"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "Test jobs MUST publish a JUnit report and a Cobertura coverage report as GitLab artifacts so results are visible on the MR."
  - id: "TST-050"
    level: "MUST"
    enforcement: "ci"
    tool: "gitlab"
    doc: "24-testing-standards.md"
    owner: "Engineering Quality lead"
    retired: false
    text: "A scheduled pipeline MUST run mutation, `live_llm`, e2e and performance smoke jobs, and its failures MUST create a tracked issue."
  - id: "REG-001"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Every tool an agent can call (MCP, OpenAPI, function, or Foundry built-in) MUST have a manifest in `registry/tools/`; a tool without a manifest MUST fail CI."
  - id: "REG-002"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Every agent MUST have a manifest in `registry/agents/`; an agent without a manifest MUST NOT be deployed."
  - id: "REG-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The Git manifests are the source of truth. Runtime catalogs (Foundry Toolbox, tool catalog, Entra Agent Registry) MUST be populated from them by CI and MUST NOT be edited by hand. ASSUMPTION: this registry-platform choice is open item F12."
  - id: "REG-004"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Manifests MUST validate against the JSON Schemas in this doc using a validator with format checking enabled, and the embedded `input_schema`, `output_schema` and `error_schema` MUST themselves be valid JSON Schema 2020-12."
  - id: "REG-005"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "An agent MUST bind only the tools in its manifest `allowed_tools`, resolved by tool `id` and version range, and only tools whose status is `approved`. Everything else MUST be refused at tool dispatch, not by prompt wording."
  - id: "REG-006"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Every `allowed_tools` entry MUST resolve to an existing manifest whose version satisfies the range; unresolved or non-approved references MUST fail CI."
  - id: "REG-007"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tools that appear on a server after approval MUST NOT be bound until they have a manifest. Agents MUST ignore unregistered tools returned by a tool listing."
  - id: "REG-008"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tools and agents MUST move through `draft -> evaluated -> approved -> deprecated -> retired`. Approval MUST be recorded by a reviewer other than the author; an AI agent MUST NOT approve its own manifest."
  - id: "REG-009"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Any change to a tool's `description`, `input_schema`, `output_schema`, `error_schema`, `auth`, `limits` or `side_effects` MUST bump `version` (semantic versioning; breaking schema changes bump major) and MUST re-run the tool's evals before `status` returns to `approved`."
  - id: "REG-010"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`registry/` MUST be covered by CODEOWNERS with the tool owner and a security reviewer for `high` risk tools."
  - id: "REG-011"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "A `deprecated` manifest MUST carry a deprecation date and, where one exists, a replacement id; CI MUST fail when an `approved` agent still references a `retired` tool. ASSUMPTION: notice period between deprecated and retired is set by AI governance (F1)."
  - id: "REG-012"
    level: "MUST"
    enforcement: "manual"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The registry MUST be exported to the model and agent inventory defined in [12-governance-and-compliance.md](./12-governance-and-compliance.md); every manifest MUST carry an `inventory_id` and the export MUST be retained as audit evidence."
  - id: "REG-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tool descriptions are model-visible text and a prompt-injection surface. They MUST be reviewed like code, MUST describe only what the tool does and its inputs, and MUST NOT contain instructions to the model about other tools or about ignoring rules."
  - id: "REG-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`side_effects` and `risk_tier` MUST be assigned by the tool owner and reviewer. They MUST NOT be derived from server-reported MCP annotations, which the MCP specification says clients must treat as untrusted unless the server is trusted."
  - id: "REG-015"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tools with `side_effects` of `destructive`, or `risk_tier` of `high`, MUST set `requires_human_approval.required` to true with no exception conditions. Tools with `write` side effects follow SEC-014 (approval unless a documented low-risk condition applies). Approval MUST be enforced in code at dispatch ([04-engineering-principles.md](./04-engineering-principles.md) owns the principle)."
  - id: "REG-016"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tools with `side_effects` of `write`, `destructive` or `external` MUST declare `idempotent` and, when true, MUST accept an idempotency key (see [17-api-and-contracts.md](./17-api-and-contracts.md))."
  - id: "REG-017"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Each tool MUST define `limits` (rate, timeout, payload size) and the runtime MUST enforce them; cost limits SHOULD be set where the tool incurs per-call cost."
  - id: "REG-018"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tool `auth` MUST use the calling agent's own identity (or on-behalf-of-user where the user's permissions must apply), with the least-privilege role and scopes listed. Tools MUST NOT use shared service credentials ([06-secrets-and-env.md](./06-secrets-and-env.md))."
  - id: "REG-019"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "An agent's `data_classes` MUST NOT include a class higher than the `data_classification_max` of any tool it can call (classes: [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "REG-020"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Each tool MUST ship `docs` with usage, failure modes, at least one example and a runbook link before reaching `evaluated`."
  - id: "REG-021"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "MCP-backed tools MUST record the MCP server `pinned_version`, the protocol `spec_version` (currently 2026-07-28; VERIFY: re-check on modelcontextprotocol.io before each pin change) and `tool_definition_sha256`; the MCP client SDK version MUST be pinned in the lockfile ([20-dependencies-and-licensing.md](./20-dependencies-and-licensing.md))."
  - id: "REG-022"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`tool_definition_sha256` MUST be the SHA-256 of the canonical JSON (sorted keys, no whitespace, UTF-8) of the `tools/list` entry as returned to the agent's own identity, because the MCP list MAY vary by the authorization presented. CI MUST fail when the live server's hash differs from the manifest."
  - id: "REG-023"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The runtime MUST re-check the hash when it binds a tool and when a cached tool list expires (`ttlMs`) or a list-changed notification arrives, and MUST refuse to bind on mismatch."
  - id: "REG-024"
    level: "SHOULD"
    enforcement: "ci"
    tool: "scheduled job"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "A scheduled pipeline SHOULD run the drift check daily against each registered MCP server and open an issue for the tool owner on mismatch."
  - id: "REG-025"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "New registrations MUST NOT depend on MCP features the specification lists as deprecated (Roots, Sampling, Logging, HTTP+SSE transport, Dynamic Client Registration) without a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md))."
  - id: "REG-026"
    level: "MUST"
    enforcement: "ci"
    tool: "make eval"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Each tool and each agent MUST reference an eval dataset and thresholds ([14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md)); `approved` status MUST require `last_run` and `result_link`, and evals MUST re-run on any schema, prompt or model change."
  - id: "REG-027"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Agent manifests MUST declare purpose and non-goals, autonomy rung, allowed tools, model deployment and model version, data classes, eval suite and thresholds, guardrail policy, human-approval points, kill switch, runbook and inventory id."
  - id: "REG-028"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`model.model_version` MUST be an explicit version, never a floating alias, and CI MUST compare it with the version actually deployed by Terraform ([15-llm-and-model-governance.md](./15-llm-and-model-governance.md))."
  - id: "REG-029"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Prompts MUST be listed by path and SHA-256 of the file bytes. The prompt loader MUST verify the hash at startup and fail closed on mismatch."
  - id: "REG-030"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "`high` risk agents MUST NOT exceed the `propose` autonomy rung without a waiver. The `autonomy_rung` enum uses the canonical identifiers defined in [04-engineering-principles.md](./04-engineering-principles.md)."
  - id: "REG-031"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "The kill switch MUST be exercised in a pre-production test before an agent reaches `approved`, and the owner role MUST be on call ([18-reliability-and-operations.md](./18-reliability-and-operations.md))."
  - id: "REG-032"
    level: "MUST"
    enforcement: "runtime"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Calls between agents (A2A, agent-as-tool, or Foundry A2A tool) MUST go through the registry like any tool, and the remote agent's output MUST be treated as untrusted input."
  - id: "REG-033"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "External agents SHOULD be consumed only when their Agent Card is verified (signature check where the card is signed; the A2A specification makes signing optional) and the endpoint is allow-listed in the agent manifest."
  - id: "REG-034"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "Tool calls MUST emit the span and metrics named in the manifest `observability` block, with arguments and results redacted per [13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md) and [10-logging-observability.md](./10-logging-observability.md)."
  - id: "REG-035"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "25-ai-tool-and-agent-registry.md"
    owner: "Platform Engineering lead with AI governance"
    retired: false
    text: "A fixed workflow that calls an LLM MUST also have an agent manifest (state `workflow` in `purpose`, list its fixed tool set, and declare the rung that matches its side effects); \"it is not an agent\" is not an exemption from registration, evals or the kill switch."
  - id: "UCS-001"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Every production AI use case MUST have `docs/use-cases/<case>.md` copied from the template below and linked from its ADR."
  - id: "UCS-002"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The ADR MUST answer every ADR prompt of the matching case or state \"not applicable\" with a reason."
  - id: "UCS-003"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "If a use case spans several cases, the ADR MUST apply the strictest autonomy rung and the union of evals and threats; if none match, the ADR MUST justify the closest case and propose a new case through an MR to this doc."
  - id: "UCS-004"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The ADR MUST record why a deterministic or classical-ML solution is insufficient before an LLM is chosen ([04-engineering-principles.md](./04-engineering-principles.md))."
  - id: "UCS-005"
    level: "SHOULD"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Start at the lowest autonomy rung and move up only with eval evidence that meets the thresholds for the next rung ([14-evals-and-testing-ai.md](./14-evals-and-testing-ai.md))."
  - id: "UCS-006"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The case record MUST list data classes reaching the model and MUST show the PIA status; a PIA MUST be complete before personal information is sent to a model in production ([13-data-classification-and-privacy.md](./13-data-classification-and-privacy.md))."
  - id: "UCS-007"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Customer-facing cases MUST test English and French and state the locale behavior ([22-localization-and-accessibility.md](./22-localization-and-accessibility.md))."
  - id: "UCS-008"
    level: "MUST"
    enforcement: "ci"
    tool: "make registry-check"
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "Tools and agents named in a case record MUST have manifests ([25-ai-tool-and-agent-registry.md](./25-ai-tool-and-agent-registry.md))."
  - id: "UCS-009"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "A person who owns the use case MUST confirm the regulatory notes in the case record; an AI agent drafting the record MUST NOT mark them confirmed."
  - id: "UCS-010"
    level: "SHOULD"
    enforcement: "manual"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The catalog SHOULD be reviewed at least every six months and after any change of approved models, and `VERIFY:` markers MUST stay until confirmed."
  - id: "UCS-011"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "A use case is **high-risk** (Tier 1) when it influences coverage, pricing, underwriting or claims outcomes, takes an autonomous action affecting a customer, or processes restricted data to produce a customer-specific outcome. Cases 02, 04, 11 and 20 default to high-risk; others become high-risk when they meet this test."
  - id: "UCS-012"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "For high-risk cases a human MUST make and record the decision; the AI output MUST be labelled decision support and MUST NOT autonomously deny, rescind, reprice or approve."
  - id: "UCS-013"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "High-risk cases MUST NOT go beyond a prototype without AI governance sign-off, a bias and fairness assessment, an independent review and a revalidation schedule ([12-governance-and-compliance.md](./12-governance-and-compliance.md))."
  - id: "UCS-014"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "High-risk cases MUST NOT run above `propose` and SHOULD run at `suggest`; any higher rung needs a waiver ([21-exceptions-and-waivers.md](./21-exceptions-and-waivers.md))."
  - id: "UCS-015"
    level: "MUST"
    enforcement: "test"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "High-risk cases MUST log, for each output, the model version, prompt hash, inputs by reference, source citations and the human reviewer's decision ([10-logging-observability.md](./10-logging-observability.md))."
  - id: "UCS-016"
    level: "MUST"
    enforcement: "review"
    tool: null
    doc: "26-ai-use-case-catalog.md"
    owner: "AI governance lead with Platform Engineering lead"
    retired: false
    text: "The ADR for a high-risk case MUST describe the human review design: what the reviewer sees, how disagreement with the AI is recorded, and how automation bias is measured (for example override rate and time to decision)."
